<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Chatick</title>
    <style>
      /* Панель живёт отдельно от веб-приложения: она должна открываться
         мгновенно, поэтому никаких фреймворков и загрузок — только свой CSS.

         Вид — макет Tray.dc.html (v2): шапка с компанией, карточка таймера,
         две вкладки «На мне» / «Ждут меня». Цвета — те же, что у веба v2
         (v2/styles/main.css), светлая и тёмная тема.

         Окно панели создаёт установленная оболочка (380×520, без рамки), и
         говорит она с ней только через window.panel из preload-panel.cjs.
         Оболочку обновляет магазин, а не мы, — поэтому здесь нет ни одного
         вызова, которого там нет, и панель обязана жить со старым состоянием. */

      /* Иврит системными шрифтами выглядит чужеродно — тот же сабсет Heebo,
         что у приложения. Путь относительный: панель раздаётся с сайта рядом с
         /fonts. У вшитой копии (file://) шрифта нет — подставится системный. */
      @font-face {
        font-family: 'Heebo';
        src: url('fonts/heebo-hebrew.woff2') format('woff2');
        font-weight: 100 900;
        font-display: swap;
        unicode-range: U+0307-0308, U+0590-05FF, U+200C-2010, U+20AA, U+25CC, U+FB1D-FB4F;
      }

      :root {
        color-scheme: light;
        --bg: #ffffff;
        --card: #f2f3ef;
        --card2: #e8eae3;
        --tab-on: #ffffff;
        --tab-shadow: 0 1px 2px rgba(27, 29, 26, 0.1);
        --pop: #ffffff;
        --pop-shadow: 0 20px 50px -10px rgba(27, 29, 26, 0.28), 0 0 0 1px var(--line);
        --line: #e3e5df;
        --ink: #1b1d1a;
        --ink2: #4e524c;
        --ink3: #686c65;
        --accent: #d4f36b;
        --accent-ink: #1b1d1a;
        --moss: #1f2b1b;
        --moss-ink: #eef3e6;
        --moss2: #aeb9a5;
        --moss-hover: rgba(238, 243, 230, 0.1);
        --signal: #c2410c;
        --work: #855600;
        --work-bg: #f7ebcf;
        --rev: #2f4fc2;
        --rev-bg: #e6ebfb;
        --ask: #6a3bc0;
        --ask-bg: #eee7fa;
        --hover: rgba(27, 29, 26, 0.05);
        --scrim: rgba(27, 29, 26, 0.22);
        --scroll: #cfd2ca;
      }
      /* Тёмная — когда приложение в тёмной теме; пока оно не сказало, какая
         тема, — по системе. Блок повторяется дважды намеренно: атрибут и
         медиазапрос не объединить в один селектор. */
      @media (prefers-color-scheme: dark) {
        :root:not([data-theme='light']) {
          color-scheme: dark;
          --bg: #0f0f0f;
          --card: #181a17;
          --card2: #20231f;
          --tab-on: #20231f;
          --tab-shadow: none;
          --pop: #1b1d1a;
          --pop-shadow: 0 20px 50px -10px rgba(0, 0, 0, 0.7), 0 0 0 1px var(--line);
          --line: #2a2d28;
          --ink: #edefe8;
          --ink2: #b7bcb1;
          --ink3: #8b9086;
          --moss: #1f2b1b;
          --moss-ink: #edefe8;
          --signal: #ff8f57;
          --work: #f0c565;
          --work-bg: #33290f;
          --rev: #a3b6ff;
          --rev-bg: #1f2742;
          --ask: #c7aeff;
          --ask-bg: #2a2140;
          --hover: rgba(255, 255, 255, 0.05);
          --scrim: rgba(0, 0, 0, 0.45);
          --scroll: #33362f;
        }
      }
      :root[data-theme='dark'] {
        color-scheme: dark;
        --bg: #0f0f0f;
        --card: #181a17;
        --card2: #20231f;
        --tab-on: #20231f;
        --tab-shadow: none;
        --pop: #1b1d1a;
        --pop-shadow: 0 20px 50px -10px rgba(0, 0, 0, 0.7), 0 0 0 1px var(--line);
        --line: #2a2d28;
        --ink: #edefe8;
        --ink2: #b7bcb1;
        --ink3: #8b9086;
        --moss: #1f2b1b;
        --moss-ink: #edefe8;
        --signal: #ff8f57;
        --work: #f0c565;
        --work-bg: #33290f;
        --rev: #a3b6ff;
        --rev-bg: #1f2742;
        --ask: #c7aeff;
        --ask-bg: #2a2140;
        --hover: rgba(255, 255, 255, 0.05);
        --scrim: rgba(0, 0, 0, 0.45);
        --scroll: #33362f;
      }

      * { box-sizing: border-box; }
      html, body { height: 100%; }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--ink);
        font: 13px/1.4 'Onest', 'Heebo', system-ui, 'Segoe UI', sans-serif;
        font-feature-settings: 'tnum' 1;
        overflow: hidden;
        user-select: none;
      }
      button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
      button:disabled { cursor: default; }
      input { font: inherit; color: inherit; }
      :focus-visible { outline: 2px solid var(--rev); outline-offset: 2px; border-radius: 6px; }
      [hidden] { display: none !important; }

      .tr { position: relative; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
      .tr-view { flex: 1; min-height: 0; display: flex; flex-direction: column; }
      .ic { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; flex: none; }
      .ic.s { width: 14px; height: 14px; }
      .ic.fl { fill: currentColor; stroke: none; }
      /* Стрелки «назад/вперёд» в иврите смотрят в другую сторону. */
      [dir='rtl'] .flip { transform: scaleX(-1); }

      /* --- шапка: она же ручка — окно без рамки иначе не сдвинуть --- */
      .tr-head {
        height: 46px; flex: none;
        display: flex; align-items: center; gap: 4px;
        padding-inline: 10px 6px;
        -webkit-app-region: drag;
      }
      .tr-head button { -webkit-app-region: no-drag; }
      .tr-co {
        display: flex; align-items: center; gap: 8px; min-width: 0;
        height: 32px; padding-inline: 4px 8px; border-radius: 9px;
        font-weight: 600; font-size: 14px;
      }
      .tr-co:not(:disabled):hover { background: var(--card2); }
      .tr-co .nm { min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; unicode-bidi: plaintext; }
      .tr-co .ic { color: var(--ink3); }
      .tr-sp { flex: 1; min-width: 8px; }
      .tr-ib {
        width: 32px; height: 32px; flex: none; border-radius: 9px;
        display: grid; place-items: center; color: var(--ink2);
      }
      .tr-ib:hover { background: var(--card2); color: var(--ink); }
      .tr-me {
        width: 26px; height: 26px; border-radius: 50%; overflow: hidden;
        display: grid; place-items: center;
        background: #6b5f55; color: #fff; font-weight: 600; font-size: 12px;
      }
      .tr-me img, .tr-lg img { width: 100%; height: 100%; object-fit: cover; display: block; }

      /* Значок проекта/компании: логотип или буква на цвете — как в v2. */
      .tr-lg {
        width: 22px; height: 22px; flex: none; border-radius: 7px; overflow: hidden;
        display: grid; place-items: center;
        color: #fff; font-weight: 700; font-size: 11px; line-height: 1;
      }
      .tr-lg.co { background: var(--moss); color: var(--accent); }
      .tr-lg.brand svg { width: 100%; height: 100%; display: block; }
      .tr-lg.sm { width: 18px; height: 18px; font-size: 9.5px; border-radius: 5px; }

      /* --- таймер: главное, ради чего открывают панель --- */
      .tr-timer {
        margin: 0 10px; height: 52px; flex: none;
        display: flex; align-items: center; gap: 8px;
        padding-inline: 6px 6px; border-radius: 14px;
        background: var(--card);
      }
      .tr-timer.on { background: var(--moss); color: var(--moss-ink); }
      .tr-proj {
        display: flex; align-items: center; gap: 8px; min-width: 0; flex: 1;
        height: 40px; padding-inline: 4px 8px; border-radius: 9px; text-align: start;
      }
      .tr-proj:hover { background: var(--hover); }
      .tr-timer.on .tr-proj:hover { background: var(--moss-hover); }
      .tr-proj .tx { min-width: 0; flex: 1; display: flex; flex-direction: column; }
      .tr-proj .nm { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; unicode-bidi: plaintext; text-align: start; }
      .tr-proj .sub { font-size: 11.5px; color: var(--ink3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; text-align: start; }
      .tr-proj .ic { color: var(--ink3); }
      .tr-timer.on .tr-proj .sub, .tr-timer.on .tr-proj .ic { color: var(--moss2); }
      .tr-time { display: flex; align-items: center; gap: 7px; flex: none; }
      .tr-clock {
        font-size: 18px; font-weight: 600; letter-spacing: 0.01em;
        font-variant-numeric: tabular-nums; direction: ltr;
        border-radius: 6px; padding: 0 2px;
      }
      /* Счётчик правится на месте: «работаю два часа, а таймер включил только
         что» иначе исправлялось лишь в приложении. */
      .tr-clock.editable:hover { text-decoration: underline dotted; text-underline-offset: 4px; }
      .tr-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--accent); animation: trp 1.6s ease-in-out infinite; }
      @keyframes trp { 50% { opacity: 0.3; } }
      @media (prefers-reduced-motion: reduce) { .tr-dot { animation: none; } }
      .tr-edit { display: inline-flex; align-items: center; gap: 2px; flex: none; }
      .tr-edit input {
        /* Ширина под «20:10:00» — восемь знаков моноширинного счёта. */
        width: 84px; padding: 0; margin: 0; text-align: center; direction: ltr;
        border: 0; border-bottom: 1.5px solid var(--accent); border-radius: 0;
        background: transparent; outline: none;
        font-size: 17px; font-weight: 600; font-variant-numeric: tabular-nums;
      }
      .tr-edit input.bad { border-bottom-color: var(--signal); color: var(--signal); }
      .tr-edit button { width: 24px; height: 24px; border-radius: 7px; display: grid; place-items: center; color: var(--moss2); }
      .tr-edit button:hover { background: var(--moss-hover); color: var(--moss-ink); }
      .tr-go {
        width: 40px; height: 40px; flex: none; border-radius: 11px;
        display: grid; place-items: center;
        background: var(--accent); color: var(--accent-ink);
      }
      .tr-go.start { width: auto; padding-inline: 14px; display: inline-flex; align-items: center; gap: 6px; font-weight: 600; }
      .tr-go:not(:disabled):hover { filter: brightness(0.96); }
      .tr-go:disabled { opacity: 0.55; }

      /* --- вкладки --- */
      .tr-tabs {
        display: flex; gap: 4px; flex: none;
        margin: 10px 10px 0; padding: 3px; border-radius: 11px;
        background: var(--card);
      }
      .tr-tabs button {
        flex: 1; min-width: 0; height: 32px; border-radius: 8px;
        display: inline-flex; align-items: center; justify-content: center; gap: 6px;
        color: var(--ink2); font-weight: 500; white-space: nowrap;
      }
      .tr-tabs button.on { background: var(--tab-on); color: var(--ink); box-shadow: var(--tab-shadow); }
      .tr-tabs .n { color: var(--ink3); font-weight: 500; }
      .tr-tabs .n.hot { background: var(--accent); color: var(--accent-ink); border-radius: 999px; padding: 0 6px; font-size: 11.5px; font-weight: 600; line-height: 18px; }

      /* --- проекты-фильтры --- */
      .tr-chips {
        display: flex; gap: 6px; flex: none; overflow-x: auto;
        padding: 10px 10px 4px; scrollbar-width: none;
      }
      .tr-chips::-webkit-scrollbar { display: none; }
      .tr-chip {
        flex: none; height: 28px; padding-inline: 4px 9px; border-radius: 9px;
        display: inline-flex; align-items: center; gap: 6px;
        background: var(--card); color: var(--ink2); font-weight: 500; white-space: nowrap;
      }
      .tr-chip.all { padding-inline: 10px; }
      .tr-chip:hover { color: var(--ink); }
      .tr-chip.on { background: var(--ink); color: var(--bg); }
      .tr-chip .c { color: var(--ink3); font-weight: 600; }
      .tr-chip.on .c { color: var(--bg); opacity: 0.6; }
      .tr-chip .nm { max-width: 150px; overflow: hidden; text-overflow: ellipsis; unicode-bidi: plaintext; }

      /* --- списки --- */
      .tr-list {
        flex: 1; min-height: 0; overflow-y: auto; position: relative;
        padding: 0 6px 10px;
        scrollbar-width: thin; scrollbar-color: var(--scroll) transparent;
      }
      .tr-list::-webkit-scrollbar { width: 8px; }
      .tr-list::-webkit-scrollbar-thumb { background: var(--scroll); border-radius: 4px; }
      .tr-gh {
        position: sticky; top: 0; z-index: 1;
        display: flex; align-items: center; gap: 8px; width: 100%;
        padding: 10px 6px 4px; background: var(--bg);
        font-size: 12px; font-weight: 600; color: var(--ink2); text-align: start;
      }
      .tr-gh:hover .nm { color: var(--ink); text-decoration: underline; text-underline-offset: 3px; }
      .tr-gh .nm { min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; unicode-bidi: plaintext; }
      .tr-gh .n { color: var(--ink3); font-weight: 500; }
      .tr-gh .n.hot { background: var(--accent); color: var(--accent-ink); border-radius: 999px; padding: 0 6px; font-size: 11px; font-weight: 600; line-height: 17px; }

      .tr-row { position: relative; border-radius: 10px; }
      .tr-row:hover, .tr-row:focus-within { background: var(--card); }
      .tr-row.busy { opacity: 0.5; pointer-events: none; }
      .tr-open { display: block; width: 100%; padding: 8px 8px 9px; text-align: start; border-radius: 10px; }
      .tr-t {
        display: flex; align-items: center; gap: 6px;
        font-size: 13.5px; font-weight: 500;
      }
      .tr-t .tx { min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; unicode-bidi: plaintext; }
      [dir='ltr'] .tr-t .tx { text-align: left; }
      [dir='rtl'] .tr-t .tx { text-align: right; }
      /* Остальные подписи с unicode-bidi: plaintext — тоже по интерфейсу, а не по
         своему первому символу: «וי פיור - Vpure» в русском трее уезжало вправо,
         к стрелке, а «Сегодня 1:23» под ним оставалось слева. */
      [dir='ltr'] :is(.tr-co .nm, .tr-proj .nm, .tr-proj .sub, .tr-gh .nm, .tr-mi .nm, .tr-m .from, .cn-pick .nm, .tr-ev .l1, .tr-ev .q, .tr-ev .l3) { text-align: left; }
      [dir='rtl'] :is(.tr-co .nm, .tr-proj .nm, .tr-proj .sub, .tr-gh .nm, .tr-mi .nm, .tr-m .from, .cn-pick .nm, .tr-ev .l1, .tr-ev .q, .tr-ev .l3) { text-align: right; }
      /* Новое по задаче — непрочитанное уведомление о ней. */
      .tr-new { width: 7px; height: 7px; flex: none; border-radius: 50%; background: var(--accent); box-shadow: 0 0 0 1.5px var(--moss); }
      .tr-m {
        display: flex; align-items: center; gap: 8px; margin-top: 3px;
        font-size: 12px; color: var(--ink3); white-space: nowrap; overflow: hidden;
      }
      .tr-m > span { flex: none; }
      .tr-m .from { flex: 0 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; unicode-bidi: plaintext; }
      .tr-mv {
        display: inline-flex; align-items: center; gap: 5px;
        height: 20px; padding: 0 7px; border-radius: 6px;
        background: var(--card2); color: var(--ink); font-weight: 600; font-size: 11.5px;
      }
      .tr-mv i { width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
      .tr-mv.review { background: var(--rev-bg); color: var(--rev); }
      .tr-mv.answer { background: var(--ask-bg); color: var(--ask); }
      .tr-mv.client { background: var(--work-bg); color: var(--work); }
      .tr-row:hover .tr-mv.do, .tr-row:focus-within .tr-mv.do { background: var(--bg); }
      .tr-rnd, .tr-late { color: var(--signal); font-weight: 600; }
      .tr-soon { color: var(--work); font-weight: 600; }
      .tr-long { color: var(--work); font-weight: 600; display: inline-flex; align-items: center; gap: 3px; }
      .tr-long .ic { width: 12px; height: 12px; }
      /* Ход по мячу — кнопкой в строке. Появляется под курсором и с клавиатуры:
         постоянная кнопка на каждой строке съела бы треть ширины названий. */
      .tr-act {
        position: absolute; inset-inline-end: 8px; top: 50%; transform: translateY(-50%);
        height: 28px; padding-inline: 11px; border-radius: 8px;
        background: var(--bg); box-shadow: inset 0 0 0 1px var(--line), -14px 0 12px -2px var(--card);
        font-weight: 600; font-size: 12.5px; white-space: nowrap;
        opacity: 0; pointer-events: none; transition: opacity 0.12s;
      }
      [dir='rtl'] .tr-act { box-shadow: inset 0 0 0 1px var(--line), 14px 0 12px -2px var(--card); }
      .tr-act.acc { background: var(--accent); color: var(--accent-ink); }
      .tr-row:hover .tr-act, .tr-row:focus-within .tr-act { opacity: 1; pointer-events: auto; }
      .tr-act:hover { filter: brightness(0.96); }

      .tr-ev { display: flex; gap: 10px; width: 100%; padding: 9px 8px; border-radius: 10px; text-align: start; }
      .tr-ev:hover { background: var(--card); }
      .tr-av {
        width: 28px; height: 28px; flex: none; border-radius: 50%;
        display: grid; place-items: center;
        background: #71717a; color: #fff; font-weight: 700; font-size: 12px;
      }
      .tr-ev.new .tr-av { box-shadow: 0 0 0 2px var(--bg), 0 0 0 4px var(--accent); }
      .tr-ev .b { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px; }
      .tr-ev .l1 {
        font-size: 13px; color: var(--ink2); line-height: 1.38;
        display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
        unicode-bidi: plaintext; overflow-wrap: anywhere;
      }
      .tr-ev .l1 b { color: var(--ink); font-weight: 600; }
      .tr-ev:not(.new) .l1 { color: var(--ink3); }
      .tr-ev .q {
        color: var(--ink); line-height: 1.4;
        display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
        unicode-bidi: plaintext; overflow-wrap: anywhere;
      }
      .tr-ev:not(.new) .q { color: var(--ink2); }
      .tr-ev .l3 { font-size: 11.5px; color: var(--ink3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; unicode-bidi: plaintext; }
      /* Направление строки — по её тексту, а не по интерфейсу: уведомление на
         иврите в русском трее выравнивается справа. Имя автора стоит первым и
         пишется латиницей — изолируем его, иначе вся строка считалась левой. */
      .tr-ev .l1, .tr-ev .q, .tr-ev .l3 { text-align: start; }
      .tr-ev .l1 b { unicode-bidi: isolate; }
      [dir='rtl'] .tr-ev .l1, [dir='rtl'] .tr-ev .q, [dir='rtl'] .tr-ev .l3 { text-align: right; }
      .tr-ev time { flex: none; font-size: 11.5px; color: var(--ink3); white-space: nowrap; }
      .tr-allnot { display: block; margin: 4px auto 0; padding: 6px 10px; border-radius: 8px; color: var(--ink3); font-size: 12px; }
      .tr-allnot:hover { color: var(--ink); background: var(--card); }
      .tr-quiet { padding: 34px 24px; text-align: center; color: var(--ink3); }

      /* --- пусто / не вошли --- */
      .tr-empty {
        flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center;
        gap: 8px; padding: 24px 34px; text-align: center; color: var(--ink2);
      }
      .tr-empty b { font-size: 16px; color: var(--ink); }
      .tr-big { width: 52px; height: 52px; border-radius: 16px; margin-bottom: 6px; display: grid; place-items: center; background: var(--moss); color: var(--accent); }
      .tr-big .ic { width: 24px; height: 24px; }
      .tr-btn {
        margin-top: 8px; height: 40px; padding-inline: 16px; border-radius: 11px;
        display: inline-flex; align-items: center; gap: 8px;
        background: var(--accent); color: var(--accent-ink); font-weight: 600;
      }
      .tr-btn:hover { filter: brightness(0.96); }

      /* --- всплывающее: выбор проекта и меню аккаунта --- */
      .tr-scrim { position: absolute; inset: 0; z-index: 5; background: var(--scrim); }
      .tr-scrim.low { top: 104px; }
      .tr-pop {
        position: absolute; z-index: 6; inset-inline: 10px;
        padding: 6px; border-radius: 14px;
        background: var(--pop); box-shadow: var(--pop-shadow);
        overflow-y: auto; scrollbar-width: thin; scrollbar-color: var(--scroll) transparent;
      }
      .tr-pick { top: 104px; max-height: 360px; }
      .tr-menu { top: 44px; max-height: 466px; }
      .tr-pop .hd { padding: 6px 8px 4px; font-size: 11.5px; color: var(--ink3); }
      .tr-q {
        display: flex; align-items: center; gap: 8px;
        height: 36px; margin: 0 2px 4px; padding: 0 10px; border-radius: 9px;
        background: var(--card2); color: var(--ink3);
      }
      .tr-q input { flex: 1; min-width: 0; height: 100%; border: 0; outline: 0; background: none; color: var(--ink); }
      .tr-q:focus-within { box-shadow: inset 0 0 0 1px var(--ink3); }
      .tr-mi {
        display: flex; align-items: center; gap: 10px; width: 100%;
        height: 38px; padding-inline: 8px; border-radius: 9px;
        text-align: start; font-weight: 500;
      }
      .tr-mi:hover { background: var(--card2); }
      .tr-mi .nm { min-width: 0; flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; unicode-bidi: plaintext; }
      .tr-mi .meta { flex: none; font-size: 11.5px; color: var(--ink3); font-weight: 400; }
      .tr-mi .chk { flex: none; color: var(--rev); }
      .tr-mi > .ic { color: var(--ink3); }
      .tr-mi.danger, .tr-mi.danger > .ic { color: var(--signal); }
      .tr-mi .cnt { flex: none; background: var(--accent); color: var(--accent-ink); border-radius: 999px; padding: 0 6px; font-size: 11px; font-weight: 600; line-height: 17px; }
      .tr-div { height: 1px; margin: 4px 6px; background: var(--line); }
      .tr-who { display: flex; align-items: center; gap: 10px; padding: 8px 8px 10px; }
      .tr-who .tr-me { width: 34px; height: 34px; font-size: 14px; }
      .tr-who .tx { min-width: 0; }
      .tr-who b, .tr-who small { display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .tr-who b { font-weight: 600; unicode-bidi: plaintext; }
      .tr-who small { color: var(--ink3); font-size: 12px; }
      .tr-none { padding: 10px 8px; color: var(--ink3); }

      .tr-toast {
        position: absolute; z-index: 7; inset-inline: 10px; bottom: 10px;
        display: flex; align-items: center; gap: 8px;
        padding: 10px 12px; border-radius: 11px;
        background: var(--ink); color: var(--bg); font-weight: 500;
      }

      /* --- подключение ассистента: отдельный экран из меню аккаунта --- */
      .tr-subhead { display: flex; align-items: center; gap: 6px; flex: none; padding: 0 10px 4px 6px; font-weight: 600; font-size: 14px; }
      .cn { padding: 6px 6px 12px; }
      .cn-hint { margin: 0 0 8px; color: var(--ink2); }
      .cn-invite { display: flex; gap: 6px; margin-bottom: 14px; }
      .cn-invite code {
        min-width: 0; flex: 1; padding: 8px 10px; border-radius: 9px;
        background: var(--card); color: var(--ink2); direction: ltr; text-align: left;
        font: 11.5px/1.5 ui-monospace, 'Cascadia Mono', Consolas, monospace;
        white-space: nowrap; overflow: hidden; text-overflow: ellipsis; user-select: text;
      }
      .cn-btn { flex: none; height: 34px; padding-inline: 12px; border-radius: 9px; background: var(--accent); color: var(--accent-ink); font-weight: 600; }
      .cn-btn.ok { background: var(--card2); color: var(--ink); }
      .cn-btn:disabled { opacity: 0.5; }
      .cn-btn.ghost { background: var(--card); color: var(--ink2); }
      .cn-code {
        width: 100%; padding: 11px 10px; border: 0; border-radius: 10px; outline: none;
        background: var(--card); box-shadow: inset 0 0 0 1px var(--line);
        font: 600 15px/1 ui-monospace, 'Cascadia Mono', Consolas, monospace;
        letter-spacing: 0.12em; text-align: center; text-transform: uppercase; direction: ltr;
      }
      .cn-code:focus { box-shadow: inset 0 0 0 1.5px var(--ink); }
      .cn-box { margin-top: 4px; padding: 10px; border-radius: 12px; background: var(--card); }
      .cn-who { font-size: 14px; font-weight: 700; }
      .cn-warn { margin-top: 2px; color: var(--ink3); font-size: 12px; }
      .cn-label { display: block; margin: 10px 0 6px; color: var(--ink3); font-size: 11.5px; }
      .cn-box .tr-q { margin: 0 0 6px; background: var(--bg); }
      .cn-picker { max-height: 168px; overflow-y: auto; display: flex; flex-direction: column; gap: 2px; }
      .cn-pick { display: flex; align-items: center; gap: 8px; width: 100%; padding: 6px 8px; border-radius: 9px; text-align: start; }
      .cn-pick:hover { background: var(--card2); }
      .cn-pick.on { background: var(--bg); box-shadow: inset 0 0 0 1.5px var(--rev); }
      .cn-pick .tx { min-width: 0; flex: 1; display: flex; flex-direction: column; }
      .cn-pick .nm { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; unicode-bidi: plaintext; }
      .cn-pick .sub { font-size: 11px; color: var(--ink3); }
      .cn-group { padding: 6px 2px 2px; font-size: 11px; color: var(--ink3); }
      .cn-actions { display: flex; gap: 8px; margin-top: 10px; }
      .cn-actions .cn-btn { flex: 1; height: 36px; }
      .cn-actions .cn-btn.main { flex: 2; }
      .cn-msg { margin: 10px 0 0; font-size: 12.5px; }
      .cn-msg.ok { color: var(--ink); }
      .cn-msg.err { color: var(--signal); }
      .cn-conns { margin-top: 16px; padding-top: 10px; border-top: 1px solid var(--line); }
      .cn-conns .hd { margin-bottom: 6px; color: var(--ink3); font-size: 11.5px; }
      .cn-conn { display: flex; align-items: center; gap: 8px; padding: 7px 9px; border-radius: 9px; background: var(--card); }
      .cn-conn + .cn-conn { margin-top: 4px; }
      .cn-conn .tx { min-width: 0; flex: 1; }
      .cn-conn .nm, .cn-conn .where { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .cn-conn .where { color: var(--ink3); font-size: 11.5px; }
      .cn-kill { flex: none; height: 26px; padding-inline: 9px; border-radius: 7px; color: var(--ink2); box-shadow: inset 0 0 0 1px var(--line); font-size: 12px; }
      .cn-kill:hover { color: var(--signal); box-shadow: inset 0 0 0 1px var(--signal); }
    </style>
  </head>
  <body>
    <!-- Знак Chatick (= favicon.svg): встроен, потому что вшитая в приложение копия панели открывается с диска. -->
    <svg width="0" height="0" style="position: absolute" aria-hidden="true">
      <symbol id="brandMark" viewBox="0 0 803 803">
        <path d="M0 401.5C0 236.106 0 153.41 41.369 94.982C56.0786 74.207 74.207 56.0786 94.982 41.369C153.41 0 236.106 0 401.5 0C566.894 0 649.59 0 708.018 41.369C728.793 56.0786 746.921 74.207 761.631 94.982C803 153.41 803 236.106 803 401.5C803 566.894 803 649.59 761.631 708.018C746.921 728.793 728.793 746.921 708.018 761.631C649.59 803 566.894 803 401.5 803C236.106 803 153.41 803 94.982 761.631C74.207 746.921 56.0786 728.793 41.369 708.018C0 649.59 0 566.894 0 401.5Z" fill="black"/>
        <path d="M386.36 71.0068C324.446 74.8268 265.165 96.328 214.911 133.15C145.133 184.414 99.3978 259.845 86.2932 345.415C73.0711 430.939 94.0188 516.583 145.282 586.361C196.499 656.256 271.812 701.945 357.501 715.096C443.072 728.201 528.716 707.253 598.446 656.107C647.573 620.062 685.394 571.333 707.849 514.982L709.303 511.335C730.958 454.937 736.476 393.88 725.44 334.68C722.219 317.446 705.695 306.227 688.462 309.447C671.228 312.668 660.009 329.192 663.23 346.425C672.205 394.035 667.73 443.237 650.317 488.647C632.434 535.234 601.562 575.417 561.223 605.148C504.978 646.399 436.096 663.257 367.272 652.599C298.449 641.942 237.822 605.241 196.57 548.996C111.5 433.029 136.637 269.367 252.604 184.297C293.061 154.613 340.707 137.336 390.464 134.261C438.975 131.235 487.269 141.754 529.958 164.627C545.372 172.814 564.554 167.098 572.788 151.566C580.976 136.152 575.26 116.97 559.728 108.736C506.566 80.3268 446.582 67.33 386.36 71.0068Z" fill="white"/>
        <path d="M607.01 187.604L343.868 450.48L269.805 376.515C253.567 360.299 227.388 360.299 211.151 376.515C194.913 392.731 194.913 418.876 211.151 435.092L314.541 538.344C322.66 546.452 333.264 550.424 343.868 550.424C354.472 550.424 365.076 546.452 373.195 538.344L665.498 246.18C681.736 229.964 681.736 203.82 665.498 187.604C649.261 171.553 623.082 171.553 607.01 187.604Z" fill="#68FF04"/>
        <path d="M137.551 573.852L413.608 718.54H121.098C104.19 718.54 93.6017 700.26 102.014 685.594L146.051 608.818C150.167 601.641 149.909 592.762 145.383 585.836L137.551 573.852Z" fill="white"/>
      </symbol>
    </svg>
    <div class="tr" id="tr">
      <header class="tr-head">
        <button class="tr-co" id="coBtn" type="button">
          <span class="tr-lg brand" id="coLogo"><svg viewBox="0 0 803 803" aria-hidden="true"><use href="#brandMark" /></svg></span>
          <span class="nm" id="coName">Chatick</span>
          <svg class="ic s" id="coChev" viewBox="0 0 24 24"><path d="M6 9l6 6 6-6" /></svg>
        </button>
        <span class="tr-sp"></span>
        <button class="tr-ib" id="openApp" type="button">
          <svg class="ic" viewBox="0 0 24 24"><path d="M14 4h6v6M20 4l-9 9" /><path d="M18 14v4a2 2 0 01-2 2H6a2 2 0 01-2-2V8a2 2 0 012-2h4" /></svg>
        </button>
        <button class="tr-ib" id="meBtn" type="button" hidden><span class="tr-me" id="meAv"></span></button>
        <button class="tr-ib" id="closeBtn" type="button">
          <svg class="ic" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18" /></svg>
        </button>
      </header>

      <!-- рабочий экран: таймер, вкладки, список -->
      <div class="tr-view" id="mainView">
        <div class="tr-timer" id="timer">
          <button class="tr-proj" id="projBtn" type="button" aria-haspopup="listbox">
            <span class="tr-lg brand" id="tLogo"><svg viewBox="0 0 803 803" aria-hidden="true"><use href="#brandMark" /></svg></span>
            <span class="tx"><span class="nm" id="tName">—</span><span class="sub" id="tSub"></span></span>
            <svg class="ic s" viewBox="0 0 24 24"><path d="M6 9l6 6 6-6" /></svg>
          </button>
          <span class="tr-time" id="tTime" hidden><span class="tr-dot"></span><button class="tr-clock" id="tClock" type="button"></button></span>
          <span class="tr-edit" id="tEdit" hidden>
            <input id="tInput" spellcheck="false" inputmode="numeric" />
            <button id="tOk" type="button"><svg class="ic s" viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5" /></svg></button>
            <button id="tCancel" type="button"><svg class="ic s" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18" /></svg></button>
          </span>
          <button class="tr-go" id="goBtn" type="button"></button>
        </div>
        <div class="tr-tabs" role="tablist">
          <button role="tab" data-tab="inbox" type="button"><span id="tabInbox">Notifications</span><span class="n" id="nInbox" hidden></span></button>
          <button role="tab" data-tab="mine" type="button"><span id="tabMine">On me</span><span class="n" id="nMine"></span></button>
        </div>
        <div class="tr-chips" id="chips" hidden></div>
        <div class="tr-list" id="list"></div>
      </div>

      <!-- подключение ассистента -->
      <div class="tr-view" id="connectView" hidden>
        <div class="tr-subhead">
          <button class="tr-ib" id="backBtn" type="button"><svg class="ic flip" viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6" /></svg></button>
          <span id="connectTitle">Connect an assistant</span>
        </div>
        <div class="tr-list" id="connectBody"></div>
      </div>

      <!-- не вошли -->
      <div class="tr-empty" id="loginView" hidden>
        <span class="tr-big"><svg class="ic" viewBox="0 0 24 24"><circle cx="12" cy="8.5" r="3.5" /><path d="M5 20c.8-3.6 3.6-5.5 7-5.5s6.2 1.9 7 5.5" /></svg></span>
        <b id="loginH">You’re not signed in</b>
        <span id="loginP">Sign in to Chatick and your tasks and timer will show up here.</span>
        <button class="tr-btn" id="loginBtn" type="button">
          <svg class="ic" viewBox="0 0 24 24"><path d="M14 4h6v6M20 4l-9 9" /><path d="M18 14v4a2 2 0 01-2 2H6a2 2 0 01-2-2V8a2 2 0 012-2h4" /></svg>
          <span id="loginBtnL">Open Chatick and sign in</span>
        </button>
      </div>

      <div class="tr-scrim" id="scrim" hidden></div>
      <div class="tr-pop tr-pick" id="pick" role="listbox" hidden>
        <div class="hd" id="pickHd">Track time to</div>
        <label class="tr-q">
          <svg class="ic s" viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5" /><path d="M20 20l-4.2-4.2" /></svg>
          <input id="pickQ" spellcheck="false" />
        </label>
        <div id="pickList"></div>
      </div>
      <div class="tr-pop tr-menu" id="menu" role="menu" hidden></div>
      <div class="tr-toast" id="toast" role="status" hidden></div>
    </div>

    <script>
      'use strict'

      const P = window.panel
      let state = { authed: true, unread: 0, timer: null, notifications: [], tasks: [], projects: [], companies: [], strings: {} }

      /**
       * Подписи приходят из веба вместе с состоянием: язык выбирают в
       * приложении, и панель обязана говорить на нём же. Запасные значения —
       * на первые миллисекунды, пока состояние не пришло.
       */
      const T = (key, fallback) => state.strings?.[key] || fallback
      const $ = (id) => document.getElementById(id)
      const esc = (s) =>
        String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c])
      const store = {
        get(k) {
          try { return localStorage.getItem(k) } catch { return null }
        },
        set(k, v) {
          try { v == null ? localStorage.removeItem(k) : localStorage.setItem(k, v) } catch {}
        },
      }

      /**
       * Умеет ли установленная оболочка принять правку времени.
       *
       * preload живёт ВНУТРИ приложения, а панель грузится с сайта. Приложение
       * лежит в магазине и обновляется не по нашей воле, поэтому панель обязана
       * работать со СТАРОЙ оболочкой: нет метода — правку не предлагаем вовсе,
       * а не роняем панель на первом же клике.
       */
      const canEditElapsed = typeof P.setTimerElapsed === 'function'

      // --- что выбрано в самой панели -----------------------------------------
      // По умолчанию — уведомления, как в первой версии: трей открывают, чтобы
      // узнать, что нового. Ключ новый — прежний запоминал «На мне» первым.
      let tab = store.get('chatick.tray.tab2') === 'mine' ? 'mine' : 'inbox'
      let chip = 'all'
      let view = 'main' // 'main' | 'connect'
      let overlay = null // 'pick' | 'menu' | null
      /**
       * Компания панели. Своя, а не «та, что в окне»: в трее смотрят задачи
       * другой компании, не трогая открытое приложение. Но когда компанию
       * меняют в окне, панель идёт следом — иначе после переключения там она
       * показывала бы прежнюю, и это читалось бы как баг.
       */
      let coSel = store.get('chatick.tray.company')
      let coSeen = store.get('chatick.tray.winCompany')
      /** Таймер нажат, ответа ещё нет — кнопка не принимает второй клик. */
      let busy = { until: 0, timerId: null }
      /**
       * Запрет второго клика — не дольше четырёх секунд. Отказ сервера нового
       * состояния не присылает (таймер как был), и без своего срока кнопка так
       * и осталась бы серой.
       */
      function holdTimer() {
        busy = { until: Date.now() + 4000, timerId: state.timer?.id || null }
        setTimeout(() => state.authed !== false && view === 'main' && renderTimer(), 4100)
      }
      /** Задачи, по которым нажали ход, — до прихода нового состояния. */
      const sent = new Map()

      // --- справочники ----------------------------------------------------------
      const companies = () => (Array.isArray(state.companies) ? state.companies : [])
      const company = () => companies().find((c) => c.id === coSel) || null
      const projectById = (id) => (state.projects || []).find((p) => p.id === id)
      /** Компания задачи/уведомления. Старое состояние её не знает — тогда по проекту. */
      const companyOf = (x) => x?.companyId || projectById(x?.projectId)?.companyId || null
      /** Не знаем компанию — показываем везде: потерять дело хуже, чем показать лишнее. */
      const inCompany = (x) => {
        const c = companyOf(x)
        return !coSel || !c || c === coSel
      }
      const myTasks = () => (state.tasks || []).filter(inCompany)
      const myNotices = () => (state.notifications || []).filter(inCompany)

      /**
       * Цвет человека/компании по id — копия personColor из v2/util.ts: в
       * панели нет сборщика, импортировать оттуда нечем.
       */
      const PALETTE = ['#2F5FD0', '#B4441A', '#6D3FC4', '#0F766E', '#86198F', '#9A3412', '#1D4ED8', '#4D7C0F', '#BE185D', '#0E7490', '#B45309', '#334155']
      function colorOf(id) {
        if (!id) return '#71717A'
        let h = 0
        for (let i = 0; i < id.length; i++) h = (h * 31 + id.charCodeAt(i)) | 0
        return PALETTE[Math.abs(h) % PALETTE.length]
      }
      const letterOf = (name) => (String(name || '').trim()[0] || '?').toUpperCase()
      const initials = (name) =>
        String(name || '?').trim().split(/\s+/).slice(0, 2).map((w) => w[0]).join('').toUpperCase()

      /** Значок: картинка, если есть, иначе буква на цвете. */
      // Знак Chatick — тот же, что у установленного приложения: новый знак
      // появится вместе с обновлением самого приложения, не раньше.
      const BRAND = `<span class="tr-lg brand"><svg viewBox="0 0 803 803" aria-hidden="true"><use href="#brandMark" /></svg></span>`
      function logo(o, cls = '') {
        const letter = esc(o.letter || letterOf(o.name))
        if (o.logoUrl) {
          // Картинка не загрузилась (нет сети, file://) — возвращаем букву.
          return `<span class="tr-lg ${cls}" style="background:${esc(o.color || '#71717A')}"><img src="${esc(o.logoUrl)}" alt="" onerror="this.parentNode.textContent='${letter}'"></span>`
        }
        return `<span class="tr-lg ${cls}" style="background:${esc(o.color || '#71717A')}">${letter}</span>`
      }
      const companyLogo = (c, cls = '') => logo({ name: c?.name, logoUrl: c?.logoUrl, color: c?.color || colorOf(c?.id), letter: c?.letter }, cls)
      const projectLogo = (p, cls = '') => logo({ name: p?.name, logoUrl: p?.logoUrl, color: p?.color || colorOf(p?.id), letter: p?.letter }, cls)
      const shortName = (p) => p?.short || p?.name || ''

      const ICON = {
        play: '<svg class="ic s fl" viewBox="0 0 24 24"><path d="M8 5.5v13l11-6.5z"/></svg>',
        stop: '<svg class="ic fl" viewBox="0 0 24 24"><rect x="7" y="7" width="10" height="10" rx="1.5"/></svg>',
        check: '<svg class="ic chk" viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>',
        hourglass: '<svg class="ic" viewBox="0 0 24 24"><path d="M6.5 3h11M6.5 21h11M8 3v3.5a4 4 0 004 4 4 4 0 014 4V21M16 3v3.5a4 4 0 01-4 4 4 4 0 00-4 4V21"/></svg>',
        done: '<svg class="ic" viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>',
        clock: '<svg class="ic" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>',
        bell: '<svg class="ic" viewBox="0 0 24 24"><path d="M6 8a6 6 0 0112 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 003.4 0"/></svg>',
        user: '<svg class="ic" viewBox="0 0 24 24"><circle cx="12" cy="8.5" r="3.5"/><path d="M5 20c.8-3.6 3.6-5.5 7-5.5s6.2 1.9 7 5.5"/></svg>',
        plug: '<svg class="ic" viewBox="0 0 24 24"><path d="M9 2v5M15 2v5M6 7h12v4a6 6 0 01-12 0zM12 17v5"/></svg>',
        logout: '<svg class="ic" viewBox="0 0 24 24"><path d="M8 21H5a2 2 0 01-2-2V5a2 2 0 012-2h3M16 17l5-5-5-5M21 12H9"/></svg>',
        chevEnd: '<svg class="ic s flip" viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></svg>',
      }

      // --- время ----------------------------------------------------------------
      function elapsedSec(timer) {
        const started = timer?.startedAt ? new Date(timer.startedAt).getTime() : NaN
        return Number.isNaN(started) ? null : Math.max(0, Math.floor((Date.now() - started) / 1000))
      }
      /**
       * Счётчик: м:сс, пока часа нет, и ч:мм:сс после. Поле правки читает
       * В ТОМ ЖЕ формате (parseElapsed) — иначе одно и то же время значило бы
       * на экране и в поле разное.
       */
      function clockText(timer) {
        const sec = elapsedSec(timer)
        if (sec === null) return ''
        const h = Math.floor(sec / 3600)
        const m = Math.floor((sec % 3600) / 60)
        const s = sec % 60
        return h ? `${h}:${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}` : `${m}:${String(s).padStart(2, '0')}`
      }
      const fmtHm = (min) => `${Math.floor(min / 60)}:${String(Math.floor(min % 60)).padStart(2, '0')}`

      /**
       * Разбор натикавшего: «1:03:00» → 1 ч 3 мин, «45:10» → 45 мин 10 с.
       * Возвращает СЕКУНДЫ или null.
       *
       * Голые цифры НЕ принимаем — только формат счётчика. Раньше «200»
       * читалось как два часа, а «2:00» — как две минуты: одна мысль давала
       * два ответа. Пусть лучше не примет, чем примет НЕ ТО.
       */
      function parseElapsed(input) {
        const raw = String(input).trim().toLowerCase().replace(/\s+/g, '')
        const hms = raw.match(/^(\d{1,3}):(\d{1,2}):(\d{1,2})$/)
        if (hms) {
          const [, h, m, s] = hms
          if (Number(m) > 59 || Number(s) > 59) return null
          return Number(h) * 3600 + Number(m) * 60 + Number(s)
        }
        const ms = raw.match(/^(\d{1,3}):(\d{1,2})$/)
        if (ms) {
          const [, m, s] = ms
          if (Number(s) > 59) return null
          return Number(m) * 60 + Number(s)
        }
        return null
      }

      // --- таймер: цель -------------------------------------------------------------
      /**
       * Куда идёт время. Цель — id проекта или id компании («вся компания»,
       * v2): то же самое панель и отдаёт вебу в toggleTimer, а он отличает
       * одно от другого по своим спискам.
       */
      const runningTarget = () => (state.timer ? state.timer.projectId || state.timer.companyId || null : null)
      /** Выбранное для этой компании — то же, что в шапке v2; без выбора — сама компания. */
      function chosenTarget() {
        const c = company()
        const pid = c?.timerProjectId
        const p = pid ? projectById(pid) : null
        if (p && (!p.companyId || p.companyId === coSel)) return p.id
        return coSel
      }
      /** Что показать про цель: значок, имя, компания. */
      function targetView(id, fallbackName) {
        const p = id ? projectById(id) : null
        if (p) return { logo: projectLogo(p), name: shortName(p), companyId: p.companyId || null }
        const c = companies().find((x) => x.id === id) || (id ? null : company())
        if (c || !id) {
          return {
            // Значок самой компании, как в шапке: на зелёной карточке идущего
            // таймера моховый квадратик сливался с фоном.
            logo: c ? companyLogo(c) : BRAND,
            name: T('wholeCompany', 'Whole company'),
            companyId: c?.id || null,
          }
        }
        // Проекта нет в списке (не участник, список ещё грузится) — имя из таймера.
        return { logo: `<span class="tr-lg" style="background:${colorOf(id)}">${esc(letterOf(fallbackName))}</span>`, name: fallbackName || '—', companyId: null }
      }

      // --- отрисовка ------------------------------------------------------------
      /**
       * Значок в шапке и в таймере меняем, только когда он другой. Таймер
       * перерисовывается каждую секунду, и логотип-картинка иначе грузился бы
       * заново на каждом тике — мигал бы.
       */
      const logoCache = {}
      function swapLogo(id, html) {
        if (logoCache[id] === html) return
        logoCache[id] = html
        $(id).outerHTML = html.replace('<span class="tr-lg', '<span id="' + id + '" class="tr-lg')
      }

      function applyLook() {
        const s = state.strings || {}
        document.documentElement.dir = s.dir === 'rtl' ? 'rtl' : 'ltr'
        if (s.lang) document.documentElement.lang = s.lang
        if (s.theme === 'dark' || s.theme === 'light') document.documentElement.dataset.theme = s.theme
        else delete document.documentElement.dataset.theme
      }

      function renderHeader() {
        const guest = state.authed === false
        // Не вошли — бренд, а не компания из прошлой сессии.
        const c = guest ? null : company()
        swapLogo('coLogo', c ? companyLogo(c) : BRAND)
        $('coName').textContent = c?.name || 'Chatick'
        $('coChev').style.display = guest || !c ? 'none' : ''
        $('coBtn').disabled = guest || !c
        $('coBtn').title = T('switchCo', 'Switch company')
        $('openApp').title = $('openApp').ariaLabel = T('openApp', 'Open Chatick')
        $('closeBtn').title = $('closeBtn').ariaLabel = T('close', 'Close')

        const me = state.user
        $('meBtn').hidden = guest || !me
        if (me) {
          $('meBtn').title = $('meBtn').ariaLabel = `${me.name || ''}${me.email ? ` · ${me.email}` : ''}`
          // Только data: — картинку по https из file:// не загрузить; готовую
          // строку присылает главный процесс. Пока её нет — инициалы.
          const fb = esc(initials(me.name || me.email))
          $('meAv').innerHTML = me.avatarData ? `<img src="${esc(me.avatarData)}" alt="" onerror="this.parentNode.textContent='${fb}'">` : fb
          $('meAv').style.background = me.avatarData ? 'transparent' : colorOf(me.email || me.name)
        }
      }

      function renderTimer() {
        const t = state.timer
        const running = Boolean(t)
        $('timer').classList.toggle('on', running)

        const id = running ? runningTarget() : chosenTarget()
        const tv = targetView(id, t?.projectName)
        swapLogo('tLogo', tv.logo)
        $('tName').textContent = tv.name

        // «Сегодня 4:54»: минуты с сервера плюс то, что натикало сейчас.
        const sec = running ? elapsedSec(t) || 0 : 0
        const todayMin = typeof state.user?.todayMinutes === 'number' ? state.user.todayMinutes + sec / 60 : null
        const today = todayMin === null ? '' : `${T('today', 'Today')} ${fmtHm(todayMin)}`
        const parts = []
        if (running) {
          // Таймер идёт в другой компании — говорим, в какой: иначе «Вся
          // компания» читалась бы как эта.
          if (tv.companyId && coSel && tv.companyId !== coSel) parts.push(companies().find((c) => c.id === tv.companyId)?.name)
          parts.push(t.taskNumber || t.description)
        } else {
          parts.push(T('timerIdle', 'Timer stopped'))
        }
        parts.push(today)
        $('tSub').textContent = parts.filter(Boolean).join(' · ')
        $('projBtn').title = $('projBtn').ariaLabel = T('trackTo', 'Track time to')

        // Пока правят — не перетираем поле тиканьем: иначе набранное
        // затирается на следующей секунде.
        const editing = !$('tEdit').hidden
        $('tTime').hidden = !running || editing
        if (!running && editing) closeEdit()
        if (running && !editing) {
          $('tClock').textContent = clockText(t)
          $('tClock').classList.toggle('editable', canEditElapsed)
          $('tClock').disabled = !canEditElapsed
          $('tClock').title = canEditElapsed ? T('editElapsed', 'Click to correct the time') : ''
        }

        const go = $('goBtn')
        go.classList.toggle('start', !running)
        go.innerHTML = running ? ICON.stop : `${ICON.play}<span>${esc(T('startShort', 'Start'))}</span>`
        go.ariaLabel = go.title = running ? T('stopTimer', 'Stop timer') : T('startTimer', 'Start timer')
        go.disabled = Date.now() < busy.until && (state.timer?.id || null) === busy.timerId
        go.hidden = editing
      }

      function renderTabs() {
        const tasks = myTasks()
        const c = company()
        const unread = typeof c?.unread === 'number' ? c.unread : myNotices().filter((n) => n.unread).length
        $('tabMine').textContent = T('mine', 'On me')
        $('tabInbox').textContent = T('notices', 'Notifications')
        $('nMine').textContent = tasks.length || ''
        $('nInbox').hidden = !unread
        $('nInbox').className = 'n hot'
        $('nInbox').textContent = unread > 99 ? '99+' : String(unread)
        document.querySelectorAll('.tr-tabs button').forEach((b) => {
          const on = b.dataset.tab === tab
          b.classList.toggle('on', on)
          b.ariaSelected = String(on)
        })
      }

      /** Состояние ещё не пришло: по пустым спискам «на тебе ничего» было бы враньём. */
      const loading = () => state.authed !== false && !state.user && !companies().length

      function renderList() {
        const el = $('list')
        const top = el.scrollTop
        if (loading()) {
          $('chips').hidden = true
          el.innerHTML = `<p class="tr-quiet">${esc(T('loading', 'Loading…'))}</p>`
          return
        }
        if (tab === 'inbox') {
          $('chips').hidden = true
          el.innerHTML = renderInbox()
        } else {
          el.innerHTML = renderMine()
        }
        el.scrollTop = top
      }

      function renderMine() {
        const tasks = myTasks()
        if (!tasks.length) {
          $('chips').hidden = true
          return `<div class="tr-empty" style="height:100%">
              <span class="tr-big">${ICON.done}</span>
              <b>${esc(T('emptyH', 'Nothing on you'))}</b>
              <span>${esc(T('emptyP', 'The timer works without tasks too. New ones will show up here.'))}</span>
            </div>`
        }

        // Группы — проекты, крупные сверху (как в макете); внутри — порядок
        // сервера: вопрос, проверка, дело, просроченное раньше.
        const groups = new Map()
        for (const t of tasks) {
          const key = t.projectId || '?'
          if (!groups.has(key)) groups.set(key, [])
          groups.get(key).push(t)
        }
        const order = [...groups.keys()].sort((a, b) => groups.get(b).length - groups.get(a).length)
        if (chip !== 'all' && !groups.has(chip)) chip = 'all'

        // Фильтр проектами — только когда проектов больше одного: «Все 3 ·
        // Vpure 3» ничего не фильтрует, только занимает строку.
        const chips = $('chips')
        chips.hidden = order.length < 2
        if (order.length >= 2) {
          chips.innerHTML =
            `<button class="tr-chip all ${chip === 'all' ? 'on' : ''}" data-chip="all" type="button">${esc(T('all', 'All'))} <span class="c">${tasks.length}</span></button>` +
            order
              .map((pid) => {
                const list = groups.get(pid)
                const p = projectById(pid) || { id: pid, name: list[0].projectName || '—' }
                return `<button class="tr-chip ${chip === pid ? 'on' : ''}" data-chip="${esc(pid)}" type="button" title="${esc(p.name)}">
                  ${projectLogo(p, 'sm')}<span class="nm">${esc(list[0].projectName || shortName(p))}</span><span class="c">${list.length}</span></button>`
              })
              .join('')
        }

        let html = ''
        for (const pid of order) {
          if (chip !== 'all' && chip !== pid) continue
          const list = groups.get(pid)
          const p = projectById(pid) || { id: pid, name: list[0].projectName || '—' }
          const co = companyOf(list[0])
          html += `<button class="tr-gh" type="button" data-project="${esc(pid)}" data-co="${esc(co || '')}" title="${esc(T('openInApp', 'Opens in Chatick'))}">
              ${projectLogo(p, 'sm')}<span class="nm">${esc(list[0].projectName || shortName(p))}</span><span class="n">${list.length}</span></button>`
          for (const t of list) html += taskRow(t)
        }
        return html
      }

      function taskRow(t) {
        const busyRow = sent.has(t.id)
        const meta = []
        if (t.moveLabel) meta.push(`<span class="tr-mv ${esc(t.move || 'do')}"><i></i>${esc(t.moveLabel)}</span>`)
        else meta.push(`<span>${esc(t.number)}</span>`) // старое состояние: ходов не знает
        if (t.round) meta.push(`<span class="tr-rnd">${esc(t.round)}</span>`)
        if (t.from) meta.push(`<span class="from">${esc(t.from)}</span>`)
        if (t.wait) meta.push(`<span class="${t.long ? 'tr-long' : ''}">${t.long ? ICON.hourglass : ''}${esc(t.wait)}</span>`)
        if (t.due) meta.push(`<span class="${t.late ? 'tr-late' : t.soon ? 'tr-soon' : ''}">${esc(t.due)}</span>`)
        const act = t.action
        return `<div class="tr-row${busyRow ? ' busy' : ''}">
            <button class="tr-open" type="button" data-open="${esc(t.link)}" title="${esc(`${t.number} · ${T('openInApp', 'Opens in Chatick')}`)}">
              <span class="tr-t">${t.isNew ? '<i class="tr-new"></i>' : ''}<span class="tx">${esc(t.title)}</span></span>
              <span class="tr-m">${meta.join('')}</span>
            </button>
            ${act ? `<button class="tr-act${act.status === 'done' ? ' acc' : ''}" type="button" data-act="${esc(t.id)}" data-status="${esc(act.status)}">${esc(act.label)}</button>` : ''}
          </div>`
      }

      function renderInbox() {
        const items = myNotices()
        const all = coSel
          ? `<button class="tr-allnot" type="button" data-open="/c/${esc(coSel)}/notifications">${esc(T('allNotes', 'All notifications in Chatick'))}</button>`
          : ''
        if (!items.length) return `<p class="tr-quiet">${esc(T('inboxEmpty', 'Nothing new'))}</p>${all}`
        // По проектам, как в первой версии. Уведомления приходят от свежих к
        // старым, так что сверху — проект, где что-то случилось последним.
        const groups = new Map()
        for (const n of items) {
          const key = n.projectId || ''
          if (!groups.has(key)) groups.set(key, [])
          groups.get(key).push(n)
        }
        let html = ''
        for (const [pid, list] of groups) {
          const unread = list.filter((n) => n.unread).length
          const cnt = unread ? `<span class="n hot">${unread}</span>` : ''
          if (pid) {
            const p = projectById(pid) || { id: pid, name: list[0].projectName || '—' }
            html += `<button class="tr-gh" type="button" data-project="${esc(pid)}" data-read="1" data-co="${esc(list[0].companyId || coSel || '')}" title="${esc(T('openInApp', 'Opens in Chatick'))}">
                ${projectLogo(p, 'sm')}<span class="nm">${esc(list[0].projectName || shortName(p))}</span>${cnt}</button>`
          } else {
            const c = company()
            html += `<div class="tr-gh">${companyLogo(c, 'sm')}<span class="nm">${esc(c?.name || T('wholeCompany', 'Whole company'))}</span>${cnt}</div>`
          }
          html += list.slice(0, 8).map(noticeRow).join('')
        }
        return `<div>${html}${all}</div>`
      }

      function noticeRow(n) {
        // Старое состояние: ни автора, ни цвета — строка как была.
        const text = n.text ?? n.summary ?? n.title
        const note = n.note && n.note !== text ? n.note : null
        return `<button class="tr-ev${n.unread ? ' new' : ''}" type="button" data-open="${esc(n.link)}" data-notification="${esc(n.id)}">
            <span class="tr-av" style="background:${esc(n.color || colorOf(n.projectId))}">${esc(n.letter || letterOf(n.projectName || 'C'))}</span>
            <span class="b">
              <span class="l1">${n.who ? `<b>${esc(n.who)}</b> ` : ''}${esc(text)}</span>
              ${note ? `<q class="q">${esc(note)}</q>` : ''}
            </span>
            ${n.when ? `<time>${esc(n.when)}</time>` : ''}
          </button>`
      }

      // --- выбор проекта для таймера ------------------------------------------------
      let pickQ = ''
      function pickItems() {
        const q = pickQ.trim().toLowerCase()
        const list = (state.projects || []).filter((p) => (!p.companyId || p.companyId === coSel) && (!q || p.name.toLowerCase().includes(q)))
        const whole = T('wholeCompany', 'Whole company')
        const items = []
        if (coSel && (!q || whole.toLowerCase().includes(q) || (company()?.name || '').toLowerCase().includes(q))) {
          items.push({ id: coSel, html: `${companyLogo(company())}<span class="nm">${esc(whole)}</span>` })
        }
        for (const p of list) items.push({ id: p.id, html: `${projectLogo(p)}<span class="nm">${esc(p.name)}</span>` })
        return items
      }
      function renderPick() {
        $('pickHd').textContent = T('trackTo', 'Track time to')
        $('pickQ').placeholder = T('findProj', 'Find project')
        const items = pickItems()
        const cur = state.timer ? runningTarget() : chosenTarget()
        $('pickList').innerHTML =
          items
            .map((x) => `<button class="tr-mi" role="option" type="button" data-target="${esc(x.id)}" aria-selected="${x.id === cur}">${x.html}${x.id === cur ? ICON.check : ''}</button>`)
            .join('') || `<div class="tr-none">${esc(T('noProj', 'No project “{{q}}”').replace('{{q}}', pickQ.trim()))}</div>`
      }
      /**
       * Выбор и есть старт — как в шапке v2. Идёт таймер на другом — веб
       * переносит его: стоп и старт на выбранном. Тот же — ничего не делаем.
       */
      function choose(id) {
        closeOverlay()
        if (!id) return
        if (state.timer && runningTarget() === id) return
        holdTimer()
        P.toggleTimer(id)
        renderTimer()
      }

      // --- меню аккаунта ---------------------------------------------------------------
      function renderMenu() {
        const me = state.user
        const fb = esc(initials(me?.name || me?.email))
        const av = me?.avatarData ? `<img src="${esc(me.avatarData)}" alt="">` : fb
        const cos = companies()
        let html = ''
        if (me) {
          html += `<div class="tr-who"><span class="tr-me" style="background:${me.avatarData ? 'transparent' : colorOf(me.email || me.name)}">${av}</span>
            <span class="tx"><b>${esc(me.name)}</b><small>${esc(me.email)}</small></span></div><div class="tr-div"></div>`
        }
        if (cos.length) {
          html += `<div class="hd">${esc(T('companies', 'Companies'))}</div>`
          for (const c of cos) {
            const cur = c.id === coSel
            const right = cur ? ICON.check : c.unread ? `<span class="cnt">${c.unread}</span>` : c.meta ? `<span class="meta">${esc(c.meta)}</span>` : ''
            html += `<button class="tr-mi" role="menuitemradio" aria-checked="${cur}" type="button" data-company="${esc(c.id)}">${companyLogo(c)}<span class="nm">${esc(c.name)}</span>${right}</button>`
          }
          html += '<div class="tr-div"></div>'
        }
        const item = (go, icon, label, cls = '') => `<button class="tr-mi ${cls}" role="menuitem" type="button" data-go="${go}">${icon}<span class="nm">${esc(label)}</span></button>`
        if (coSel) {
          html += item('hours', ICON.clock, T('hours', 'My hours'))
          html += item('notify', ICON.bell, T('notifyPrefs', 'Notification settings'))
          html += item('profile', ICON.user, T('profile', 'Profile'))
        }
        html += item('connect', ICON.plug, T('connectTitle', 'Connect an assistant'))
        html += '<div class="tr-div"></div>'
        html += item('logout', ICON.logout, T('logout', 'Sign out'), 'danger')
        $('menu').innerHTML = html
      }

      function openOverlay(kind) {
        overlay = kind
        closeEdit()
        $('scrim').hidden = false
        $('scrim').classList.toggle('low', kind === 'pick')
        $('pick').hidden = kind !== 'pick'
        $('menu').hidden = kind !== 'menu'
        $('projBtn').ariaExpanded = String(kind === 'pick')
        if (kind === 'pick') {
          pickQ = ''
          $('pickQ').value = ''
          renderPick()
          $('pickQ').focus()
        } else {
          renderMenu()
          $('menu').querySelector('button')?.focus()
        }
      }
      function closeOverlay() {
        overlay = null
        $('scrim').hidden = true
        $('pick').hidden = true
        $('menu').hidden = true
        $('projBtn').ariaExpanded = 'false'
      }

      // --- правка натикавшего --------------------------------------------------------
      function openEdit() {
        const t = state.timer
        if (!t || !canEditElapsed) return
        const inp = $('tInput')
        // Ровно то, что человек видел на счётчике: любой пересчёт дал бы два
        // разных числа для одного времени.
        inp.value = clockText(t)
        inp.classList.remove('bad')
        $('tTime').hidden = true
        $('goBtn').hidden = true
        $('tEdit').hidden = false
        inp.focus()
        inp.select()
      }
      function closeEdit() {
        if ($('tEdit').hidden) return
        $('tEdit').hidden = true
        $('tInput').classList.remove('bad')
        renderTimer()
      }
      function commitEdit() {
        const inp = $('tInput')
        const seconds = parseElapsed(inp.value)
        const t = state.timer
        // Потолок в сутки — тот же, что на сервере: отказ до отправки
        // понятнее ошибки после.
        if (seconds === null || !t || seconds > 24 * 3600) {
          inp.classList.add('bad')
          return
        }
        P.setTimerElapsed?.(t.id, seconds)
        closeEdit()
      }

      // --- подключение ассистента -------------------------------------------------------
      //
      // Коды приходят из редактора или терминала, и лезть за ними в браузер
      // неудобно — панель уже открыта. Проверку и подтверждение делает веб:
      // права и сессия есть только у него.
      let connect = { code: '', clientName: null, msg: null, msgKind: null, busy: false, target: null, q: '' }

      function connectTargets() {
        const grantable = companies().filter((c) => c.canGrantCompany)
        const names = new Map(companies().map((c) => [c.id, c.name]))
        return [
          // Мастер-доступ — отдельной строкой: это решение другого рода,
          // открыть всё сразу, включая компании, куда позовут позже.
          { key: 'a:all', name: T('connectMasterTitle', 'All my projects'), sub: T('connectMasterNote', 'every company and project, including future ones'), logo: '<span class="tr-lg co">∗</span>' },
          ...grantable.map((c) => ({ key: `c:${c.id}`, name: c.name, sub: T('connectAllProjectsOf', 'all projects, including future ones'), logo: companyLogo(c) })),
          ...(state.projects || []).map((p) => ({ key: `p:${p.id}`, name: p.name, sub: names.size > 1 ? names.get(p.companyId) || null : null, logo: projectLogo(p) })),
        ]
      }

      function renderConnect() {
        const targets = connectTargets()
        // Автовыбор — НИКОГДА не мастер-строка: человек нажал бы «Разрешить»,
        // молча открыв всё. Берём первую обычную цель.
        if (!connect.target) connect.target = targets.find((x) => x.key[0] !== 'a')?.key || null
        const q = connect.q.trim().toLowerCase()
        const shown = q ? targets.filter((x) => x.name.toLowerCase().includes(q) || (x.sub || '').toLowerCase().includes(q)) : targets
        const row = (x) => `<button class="cn-pick ${x.key === connect.target ? 'on' : ''}" type="button" data-target="${esc(x.key)}">
            ${x.logo}<span class="tx"><span class="nm">${esc(x.name)}</span>${x.sub ? `<span class="sub">${esc(x.sub)}</span>` : ''}</span></button>`
        const group = (kind, title) => {
          const list = shown.filter((x) => x.key[0] === kind)
          return list.length ? (title ? `<div class="cn-group">${esc(title)}</div>` : '') + list.map(row).join('') : ''
        }
        const picker = group('a') + group('c', T('connectGroupCompanies', 'Companies')) + group('p', T('connectGroupProjects', 'Projects'))
        // Код опознан — на экране остаётся только выбор области: главное
        // действие должно быть видно целиком, без прокрутки.
        const deciding = Boolean(connect.clientName)
        const conns = (state.connections || [])
          .map(
            (c) => `<div class="cn-conn"><span class="tx"><div class="nm">${esc(c.clientName)}</div>
              <div class="where">${esc(c.where)}${c.scope === 'all' ? ` · ${esc(T('connectMasterBadge', 'master access'))}` : c.scope === 'company' ? ` · ${esc(T('connectWholeCompany', 'whole company'))}` : ''}</div></span>
              <button class="cn-kill" type="button" data-revoke="${esc(c.id)}">${esc(T('connectRevoke', 'Revoke'))}</button></div>`,
          )
          .join('')
        return `<div class="cn">
          ${
            deciding
              ? ''
              : `<p class="cn-hint">${esc(T('connectInviteHint', 'Paste this into your assistant:'))}</p>
                 <div class="cn-invite"><code>${esc(state.strings?.inviteLine || '')}</code>
                   <button class="cn-btn" id="cnCopy" type="button">${esc(T('connectCopy', 'Copy'))}</button></div>
                 <p class="cn-hint">${esc(T('connectHint', 'Enter the code shown by your assistant'))}</p>
                 <input id="cnCode" class="cn-code" maxlength="12" spellcheck="false" placeholder="XXXX-XXXX" value="${esc(connect.code)}" />`
          }
          ${
            deciding
              ? `<div class="cn-box">
                   <div class="cn-who">${esc(connect.clientName)}</div>
                   <div class="cn-warn">${esc(T('connectActsAsYou', 'Will act on your behalf in the chosen project'))}</div>
                   <label class="cn-label">${esc(T('connectWhere', 'Where to grant access'))}</label>
                   <label class="tr-q"><svg class="ic s" viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5"/><path d="M20 20l-4.2-4.2"/></svg>
                     <input id="cnSearch" spellcheck="false" placeholder="${esc(T('connectSearch', 'Search…'))}" value="${esc(connect.q)}" /></label>
                   <div class="cn-picker">${picker || `<div class="tr-none">${esc(q ? T('connectNothingFound', 'Nothing found') : T('emptyProjects', 'No projects yet'))}</div>`}</div>
                   <div class="cn-actions">
                     <button class="cn-btn main" id="cnAllow" type="button" ${connect.target && !connect.busy ? '' : 'disabled'}>${esc(T('connectAllow', 'Allow'))}</button>
                     <button class="cn-btn ghost" id="cnCancel" type="button">${esc(T('connectCancel', 'Cancel'))}</button>
                   </div>
                 </div>`
              : ''
          }
          ${connect.msg ? `<p class="cn-msg ${connect.msgKind || ''}">${esc(connect.msg)}</p>` : ''}
          ${conns && !deciding ? `<div class="cn-conns"><div class="hd">${esc(T('connectActive', 'Active connections'))}</div>${conns}</div>` : ''}
        </div>`
      }

      /** Перерисовка экрана подключения без потери курсора в поле. */
      function refreshConnect() {
        const focused = document.activeElement?.id
        const caret = focused === 'cnCode' || focused === 'cnSearch' ? document.activeElement.selectionStart : null
        $('connectTitle').textContent = T('connectTitle', 'Connect an assistant')
        $('connectBody').innerHTML = renderConnect()
        const again = focused ? $(focused) : null
        if (again) {
          again.focus()
          if (caret !== null) again.setSelectionRange(caret, caret)
        } else if (!connect.clientName) {
          // Курсор в поле сразу: экран открывают ровно затем, чтобы вставить код.
          $('cnCode')?.focus()
        }
      }

      P.onConnect?.((r) => {
        connect.busy = false
        if (r.step === 'found') {
          connect.clientName = r.clientName
          connect.msg = null
        } else if (r.step === 'invalid') {
          // Пока код набирают, «не найден» — обычное состояние: ругаемся
          // только на полностью введённый.
          connect.clientName = null
          connect.msg = connect.code.length >= 9 ? T('connectBadCode', 'Code not found or expired') : null
          connect.msgKind = 'err'
        } else if (r.step === 'approved') {
          connect = { code: '', clientName: null, target: null, busy: false, q: '', msg: T('connectDone', 'Go back to your assistant and finish connecting'), msgKind: 'ok' }
        } else if (r.step === 'revoked') {
          connect.msg = T('connectRevoked', 'Connection closed')
          connect.msgKind = 'ok'
        } else if (r.step === 'failed') {
          connect.msg = r.error || T('connectFailed', 'Could not grant access')
          connect.msgKind = 'err'
        }
        if (view === 'connect') refreshConnect()
      })

      function setView(next) {
        view = next
        closeOverlay()
        if (next === 'connect') {
          // Список подключений живёт минутным опросом — при открытии экрана
          // обновляем сразу, иначе только что выданный доступ не видно.
          P.refreshConnections?.()
          refreshConnect()
        }
        render()
      }

      // --- общий проход -------------------------------------------------------------
      let toastTimer = 0
      function toast(text) {
        const el = $('toast')
        el.textContent = text
        el.hidden = false
        clearTimeout(toastTimer)
        toastTimer = setTimeout(() => (el.hidden = true), 2200)
      }

      function render() {
        applyLook()
        const guest = state.authed === false
        renderHeader()
        $('loginView').hidden = !guest
        $('mainView').hidden = guest || view !== 'main'
        $('connectView').hidden = guest || view !== 'connect'
        if (guest) {
          closeOverlay()
          $('loginH').textContent = T('loginH', 'You’re not signed in')
          $('loginP').textContent = T('loginP', 'Sign in to Chatick and your tasks and timer will show up here.')
          $('loginBtnL').textContent = T('loginBtn', 'Open Chatick and sign in')
          return
        }
        $('backBtn').title = $('backBtn').ariaLabel = T('back', 'Back')
        if (view === 'connect') return refreshConnect()
        renderTimer()
        renderTabs()
        renderList()
        if (overlay === 'pick') renderPick()
        if (overlay === 'menu') renderMenu()
      }

      /** Компания панели: своя, но следует за окном, когда там переключились. */
      function syncCompany() {
        const win = state.company?.id || null
        if (win && win !== coSeen) {
          coSeen = win
          coSel = win
          store.set('chatick.tray.winCompany', win)
          store.set('chatick.tray.company', win)
        }
        const cos = companies()
        if (cos.length && !cos.some((c) => c.id === coSel)) {
          coSel = win || cos[0].id
          store.set('chatick.tray.company', coSel)
        }
      }

      // --- события -------------------------------------------------------------------
      $('openApp').onclick = () => P.openApp()
      $('loginBtn').onclick = () => P.openApp()
      $('closeBtn').onclick = () => P.close()
      $('coBtn').onclick = () => (overlay === 'menu' ? closeOverlay() : openOverlay('menu'))
      $('meBtn').onclick = () => (overlay === 'menu' ? closeOverlay() : openOverlay('menu'))
      $('projBtn').onclick = () => (overlay === 'pick' ? closeOverlay() : openOverlay('pick'))
      $('scrim').onclick = () => closeOverlay()
      $('backBtn').onclick = () => setView('main')

      // Стоп — что бы ни шло (веб сам знает, что). Старт — на выбранном для
      // этой компании, а без выбора — на самой компании (v2).
      $('goBtn').onclick = () => {
        const target = state.timer ? null : chosenTarget()
        holdTimer()
        P.toggleTimer(target)
        renderTimer()
      }

      $('tClock').onclick = () => openEdit()
      // Пускаем только цифры и двоеточие: дешевле не дать набрать, чем потом
      // объяснять, почему не приняли. Длина — до «20:10:00».
      $('tInput').oninput = (e) => {
        const cleaned = e.target.value.replace(/[^\d:]/g, '').slice(0, 8)
        if (cleaned !== e.target.value) e.target.value = cleaned
        e.target.classList.remove('bad')
      }
      $('tInput').onkeydown = (e) => {
        if (e.key === 'Enter') { e.preventDefault(); commitEdit() }
        else if (e.key === 'Escape') { e.preventDefault(); e.stopPropagation(); closeEdit() }
      }
      // Ушли мимо — закрываем без сохранения. Но НЕ когда жмут галочку:
      // blur приходит раньше клика, и правка терялась бы в момент подтверждения.
      $('tInput').onblur = (e) => {
        if (e.relatedTarget && e.relatedTarget.closest('#tEdit')) return
        closeEdit()
      }
      $('tOk').onclick = () => commitEdit()
      $('tCancel').onclick = () => closeEdit()

      document.querySelectorAll('.tr-tabs button').forEach((b) => {
        b.onclick = () => {
          tab = b.dataset.tab
          store.set('chatick.tray.tab2', tab)
          renderTabs()
          $('list').scrollTop = 0
          renderList()
        }
      })

      $('chips').onclick = (e) => {
        const c = e.target.closest('[data-chip]')
        if (!c) return
        chip = c.dataset.chip
        $('list').scrollTop = 0
        renderList()
      }
      // Колесо над фильтрами листает их вбок: мышь без горизонтальной прокрутки
      // иначе до дальних проектов не доставала.
      $('chips').addEventListener('wheel', (e) => {
        if (!e.deltaY || e.deltaX) return
        e.preventDefault()
        $('chips').scrollBy({ left: document.documentElement.dir === 'rtl' ? -e.deltaY : e.deltaY })
      }, { passive: false })

      $('list').onclick = (e) => {
        const act = e.target.closest('[data-act]')
        if (act) {
          // Ход по мячу. Строку гасим сразу: ответ придёт новым состоянием, а
          // кнопка, которая после клика выглядит как прежде, зовёт нажать ещё раз.
          const task = (state.tasks || []).find((t) => t.id === act.dataset.act)
          sent.set(act.dataset.act, Date.now())
          P.taskStatus(act.dataset.act, act.dataset.status)
          toast(`${T('sent', 'Sent')}: ${act.textContent.trim()} · ${task?.number || ''}`)
          renderList()
          return
        }
        const head = e.target.closest('[data-project]')
        if (head) {
          const co = head.dataset.co || coSel
          const link = `/c/${co}?p=${encodeURIComponent(head.dataset.project)}`
          // Из группы уведомлений — с проектом: веб гасит все его уведомления,
          // человек уходит смотреть их разом (так было и в первой версии).
          if (co && head.dataset.read && P.openProject) window.panel.openProject(link, head.dataset.project)
          else if (co) P.open(link)
          return
        }
        const open = e.target.closest('[data-open]')
        if (open) {
          // id уведомления передаём явно: по ссылке их не различить —
          // несколько уведомлений ведут в одно место.
          P.open(open.dataset.open, open.dataset.notification || null)
        }
      }

      $('pickList').onclick = (e) => {
        const b = e.target.closest('[data-target]')
        if (b) choose(b.dataset.target)
      }
      $('pickQ').oninput = (e) => {
        pickQ = e.target.value
        renderPick()
      }
      $('pickQ').onkeydown = (e) => {
        if (e.key === 'Enter') {
          e.preventDefault()
          choose(pickItems()[0]?.id)
        }
      }

      $('menu').onclick = (e) => {
        const c = e.target.closest('[data-company]')
        if (c) {
          coSel = c.dataset.company
          store.set('chatick.tray.company', coSel)
          chip = 'all'
          closeOverlay()
          $('list').scrollTop = 0
          render()
          return
        }
        const go = e.target.closest('[data-go]')?.dataset.go
        if (!go) return
        closeOverlay()
        const base = coSel ? `/c/${coSel}` : null
        if (go === 'connect') return setView('connect')
        // Выход — особым адресом: у оболочки нет своего вызова, а переход есть.
        if (go === 'logout') return P.open('/logout')
        if (!base) return
        if (go === 'hours') P.open(`${base}/time`)
        else if (go === 'notify') P.open(`${base}/settings/notifications`)
        else if (go === 'profile') P.open(`${base}/settings/profile`)
      }

      $('connectBody').onclick = async (e) => {
        const pick = e.target.closest('[data-target]')
        if (pick) {
          connect.target = pick.dataset.target
          return refreshConnect()
        }
        const kill = e.target.closest('[data-revoke]')
        if (kill) {
          kill.disabled = true
          return P.revokeConnection(kill.dataset.revoke)
        }
        if (e.target.closest('#cnCopy')) {
          const btn = $('cnCopy')
          try {
            await navigator.clipboard.writeText(state.strings?.inviteLine || '')
            btn.textContent = T('connectCopied', 'Copied')
            btn.classList.add('ok')
            setTimeout(() => {
              btn.textContent = T('connectCopy', 'Copy')
              btn.classList.remove('ok')
            }, 1600)
          } catch {
            /* буфер недоступен — строку видно, можно выделить руками */
          }
          return
        }
        if (e.target.closest('#cnAllow')) {
          if (!connect.target) return
          const kind = connect.target[0]
          const id = connect.target.slice(2)
          connect.busy = true
          connect.msg = null
          refreshConnect()
          P.approveCode(connect.code, kind === 'a' ? { all: true } : kind === 'c' ? { companyId: id } : { projectId: id })
          return
        }
        if (e.target.closest('#cnCancel')) {
          connect = { code: '', clientName: null, msg: null, msgKind: null, busy: false, target: null, q: '' }
          refreshConnect()
        }
      }
      $('connectBody').oninput = (e) => {
        if (e.target.id === 'cnCode') {
          connect.code = e.target.value.trim()
          connect.clientName = null
          connect.msg = null
          // XXXX-XXXX: набрали нужную длину — спрашиваем, кто это; жать
          // «проверить» вручную незачем.
          if (connect.code.replace(/[^0-9a-z]/gi, '').length >= 8) {
            connect.busy = true
            P.checkCode(connect.code)
          }
        } else if (e.target.id === 'cnSearch') {
          connect.q = e.target.value
          refreshConnect()
        }
      }

      // Escape — шаг назад: меню, экран подключения, а потом и сама панель.
      document.addEventListener('keydown', (e) => {
        if (e.key !== 'Escape' || e.defaultPrevented) return
        if (overlay) return closeOverlay()
        if (view !== 'main') return setView('main')
        P.close()
      })

      P.onState((next) => {
        const prevTimer = state.timer?.id || null
        state = { ...state, ...next }
        syncCompany()
        // Ответ пришёл: таймер сменился — кнопка снова принимает клики.
        if ((state.timer?.id || null) !== prevTimer) busy = { until: 0, timerId: null }
        // Ход по задаче принят — строка ушла из списка или сменила ход; держим
        // пометку не дольше пары обновлений, чтобы отказ не оставил её серой.
        for (const [id, at] of sent) if (Date.now() - at > 1500) sent.delete(id)
        render()
      })

      // Секунды должны идти: панель открыта, пока на неё смотрят.
      setInterval(() => {
        if (state.timer && view === 'main' && state.authed !== false) renderTimer()
      }, 1000)
      render()
    </script>
  </body>
</html>
