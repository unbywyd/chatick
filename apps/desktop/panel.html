<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Chatick</title>
    <style>
      /* Панель живёт отдельно от веб-приложения: она должна открываться
         мгновенно, поэтому никаких фреймворков и загрузок — только свой CSS. */
      :root {
        color-scheme: dark;
        --bg: #0f0f0f;
        --card: #171717;
        --line: #262626;
        --text: #ededed;
        --muted: #8a8a8a;
        --brand: #d4f34a;
        --warn: #f5a524;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        font: 13px/1.45 system-ui, -apple-system, 'Segoe UI', sans-serif;
        background: var(--bg);
        color: var(--text);
        height: 100vh;
        display: flex;
        flex-direction: column;
        overflow: hidden;
        user-select: none;
      }

      /* --- таймер: главное, ради чего открывают панель --- */
      .timer {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 14px 16px;
        border-bottom: 1px solid var(--line);
        /* Полоса с таймером работает ручкой: окно без рамки иначе не сдвинуть,
           а его позиция от значка в трее подходит не всем и не всегда. */
        -webkit-app-region: drag;
      }
      /* Кнопка внутри ручки должна оставаться кнопкой. */
      .play, .timer-info { -webkit-app-region: no-drag; }
      .play {
        width: 40px; height: 40px;
        flex: 0 0 auto;
        border: 0; border-radius: 50%;
        background: var(--brand); color: #111;
        font-size: 15px; cursor: pointer;
        display: grid; place-items: center;
      }
      .play.running { background: #2a2a2a; color: var(--brand); }
      .play:disabled { opacity: .45; cursor: default; }
      .play:not(:disabled):hover { background: #e2ff62; }
      .play.running:hover { background: #333; }
      .timer-info { min-width: 0; flex: 1; }
      .elapsed {
        font: 600 20px/1.1 ui-monospace, 'SF Mono', Menlo, monospace;
        font-variant-numeric: tabular-nums;
        color: var(--brand);
      }
      .elapsed.idle { color: var(--muted); font-weight: 400; font-size: 14px; }
      .timer-sub {
        margin-top: 2px;
        color: var(--muted);
        white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
      }

      /* --- вкладки --- */
      nav {
        display: flex;
        gap: 2px;
        padding: 8px 12px 0;
        border-bottom: 1px solid var(--line);
      }
      nav button {
        border: 0; background: none;
        color: var(--muted);
        font: inherit;
        padding: 6px 10px 8px;
        border-bottom: 2px solid transparent;
        cursor: pointer;
      }
      nav button.active { color: var(--text); border-bottom-color: var(--brand); }
      nav .count {
        margin-inline-start: 5px;
        background: var(--brand); color: #111;
        border-radius: 9px; padding: 0 5px;
        font-size: 10px; font-weight: 700;
      }

      main { flex: 1; overflow-y: auto; padding: 6px; }
      main::-webkit-scrollbar { width: 8px; }
      main::-webkit-scrollbar-thumb { background: #2e2e2e; border-radius: 4px; }

      .row {
        display: flex; align-items: flex-start; gap: 9px;
        width: 100%;
        padding: 8px 10px;
        border: 0; border-radius: 8px;
        background: none; color: inherit;
        font: inherit; text-align: start;
        cursor: pointer;
      }
      .row:hover { background: var(--card); }
      .avatar {
        width: 26px; height: 26px; flex: 0 0 auto;
        border-radius: 50%;
        background: #2a2a2a;
        display: grid; place-items: center;
        font-size: 11px; font-weight: 600; color: var(--muted);
        overflow: hidden;
      }
      .avatar img { width: 100%; height: 100%; object-fit: cover; }
      .badge-dot {
        width: 7px; height: 7px; flex: 0 0 auto;
        border-radius: 50%; background: var(--brand);
        margin-top: 8px;
      }
      .body { min-width: 0; flex: 1; }
      .title { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .sub {
        color: var(--muted); font-size: 11.5px;
        white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
      }
      .num {
        font: 11px ui-monospace, monospace;
        color: var(--muted);
        flex: 0 0 auto; padding-top: 2px;
      }
      .empty { padding: 34px 16px; text-align: center; color: var(--muted); }

      /* Задача — то, на что тратится время: статус и таймер должны меняться
         здесь же, без похода в приложение. */
      .task-actions { display: flex; gap: 3px; flex: 0 0 auto; align-self: center; }
      /* Кнопки не должны налезать на текст: место под них резервируем всегда. */
      .row .body { min-width: 0; }

      /* Выбор статуса: список вместо «следующего по кругу» — гадать, куда
         попадёшь, не нужно. */
      .status-menu {
        position: absolute; z-index: 20;
        min-width: 150px; padding: 4px;
        border: 1px solid var(--line); border-radius: 8px;
        background: var(--card); box-shadow: 0 8px 24px rgba(0,0,0,.5);
      }
      .status-menu button {
        display: flex; align-items: center; gap: 8px;
        width: 100%; padding: 6px 8px;
        border: 0; border-radius: 6px;
        background: none; color: var(--text);
        font: inherit; text-align: start; cursor: pointer;
      }
      .status-menu button:hover { background: #232323; }
      .status-menu button.on { color: var(--brand); }
      .mini {
        width: 22px; height: 22px;
        /* flex + центрирование по обеим осям и НУЛЕВЫЕ отступы: любой паддинг
           или строчный контекст сдвигают иконку с середины. */
        display: flex; align-items: center; justify-content: center;
        padding: 0; margin: 0; line-height: 0;
        border: 1px solid var(--line); border-radius: 6px;
        background: none; color: var(--muted);
        font: 11px/1 system-ui, sans-serif; cursor: pointer;
        transition: border-color .12s, color .12s, background .12s;
      }
      .mini:hover { border-color: var(--brand); color: var(--brand); }
      .mini.on { background: var(--brand); border-color: var(--brand); color: #111; }
      /* Иконки статуса — те же, что в приложении: круг → круг с точкой →
         глаз → галочка, и те же цвета. */
      .status-icon { flex: 0 0 auto; align-self: center; display: block; }
      /* Внутри кнопки центрирование задаёт сама кнопка — своё выравнивание и
         отступы иконки здесь только мешают. */
      .mini .status-icon { align-self: auto; margin: 0; display: block; }
      .st-todo { color: var(--muted); }
      .st-in_progress { color: #38bdf8; }
      .st-review { color: #a78bfa; }
      .st-done { color: var(--brand); }

      /* Активный проект: с ним работает таймер и его видит ассистент —
         значит он должен быть виден и здесь, а не угадываться. */
      .row.active { background: #1a1a1a; }
      .row.active .title { color: var(--brand); }
      .row-open {
        flex: 0 0 auto; align-self: center;
        border: 1px solid var(--line); border-radius: 6px;
        background: none; color: var(--muted);
        font: inherit; font-size: 11px; padding: 3px 8px; cursor: pointer;
      }
      .row-open:hover { border-color: var(--brand); color: var(--brand); }
      .row-here {
        flex: 0 0 auto; align-self: center;
        font-size: 10px; color: var(--brand);
        border: 1px solid var(--brand); border-radius: 5px; padding: 1px 6px;
      }

      /* --- подключение ассистента --- */
      .connect { padding: 12px 10px; }
      .connect-hint { color: var(--muted); margin-bottom: 10px; }
      /* Строка-приглашение для ассистента: без неё за кодом всё равно надо
         идти в приложение, и вкладка теряет смысл. */
      .invite { margin-bottom: 12px; }
      .invite-row { display: flex; gap: 6px; }
      .invite-row code {
        min-width: 0; flex: 1;
        border: 1px solid var(--line); border-radius: 7px;
        background: var(--bg); color: var(--muted);
        font: 11px/1.5 ui-monospace, 'SF Mono', Menlo, monospace;
        padding: 7px 9px;
        white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
      }
      .invite-row button {
        flex: 0 0 auto;
        border: 1px solid var(--brand); border-radius: 7px;
        background: var(--brand); color: #111;
        font: inherit; font-weight: 600; padding: 0 11px; cursor: pointer;
      }
      .invite-row button:hover { background: #e2ff62; }
      .invite-row button.done { background: var(--card); border-color: var(--line); color: var(--brand); }

      .code-input {
        width: 100%;
        border: 1px solid var(--line); border-radius: 8px;
        background: var(--card); color: var(--text);
        font: 600 15px/1 ui-monospace, 'SF Mono', Menlo, monospace;
        letter-spacing: .12em; text-align: center; text-transform: uppercase;
        padding: 11px 10px;
      }
      .code-input:focus { outline: 0; border-color: var(--brand); }
      .connect-box {
        margin-top: 10px; padding: 11px 12px;
        border: 1px solid var(--line); border-radius: 8px;
        background: var(--card);
      }
      .connect-who { font-weight: 600; }
      .connect-warn { margin-top: 4px; color: var(--muted); font-size: 11.5px; }
      .connect-label { display: block; margin: 10px 0 5px; color: var(--muted); font-size: 11.5px; }

      /* Свой список, а не <select>: нативный выпадающий список — отдельное
         окно ОС, оно забирает фокус, и панель закрывалась по blur на каждом
         клике. Заодно он не поддаётся оформлению. */
      .picker { display: flex; flex-direction: column; gap: 3px; max-height: 132px; overflow-y: auto; }
      .picker::-webkit-scrollbar { width: 6px; }
      .picker::-webkit-scrollbar-thumb { background: #2e2e2e; border-radius: 3px; }
      .pick {
        display: flex; align-items: center; gap: 8px;
        border: 1px solid transparent; border-radius: 7px;
        background: var(--bg); color: var(--text);
        font: inherit; text-align: start;
        padding: 7px 9px; cursor: pointer;
      }
      .pick:hover { background: #1e1e1e; }
      .pick-body { display: flex; flex-direction: column; align-items: flex-start; gap: 1px; min-width: 0; flex: 1; }
      .pick-sub { font-size: 10px; color: #7a7a7a; }
      .target-search {
        width: 100%; box-sizing: border-box; margin-bottom: 6px; padding: 7px 10px;
        background: #131313; border: 1px solid #2a2a2a; border-radius: 8px;
        color: #e8e8e8; font-size: 12px; outline: none;
      }
      .target-search:focus { border-color: var(--brand); }
      .pick.on { border-color: var(--brand); background: #1e1e1e; }
      .pick .dot {
        width: 9px; height: 9px; flex: 0 0 auto;
        border-radius: 3px; background: #3a3a3a;
      }
      .pick .pick-name { min-width: 0; flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .pick .pick-tag {
        flex: 0 0 auto; font-size: 10px; color: var(--muted);
        border: 1px solid var(--line); border-radius: 5px; padding: 1px 5px;
      }

      /* Действующие подключения */
      .conns { margin-top: 14px; border-top: 1px solid var(--line); padding-top: 11px; }
      .conns-title { color: var(--muted); font-size: 11.5px; margin-bottom: 7px; }
      .conn {
        display: flex; align-items: center; gap: 8px;
        padding: 7px 9px; border-radius: 7px; background: var(--card);
      }
      .conn + .conn { margin-top: 4px; }
      .conn-body { min-width: 0; flex: 1; }
      .conn-name { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .conn-where { color: var(--muted); font-size: 11px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .conn-kill {
        flex: 0 0 auto;
        border: 1px solid var(--line); border-radius: 6px;
        background: none; color: var(--muted);
        font: inherit; font-size: 11px; padding: 3px 8px; cursor: pointer;
      }
      .conn-kill:hover { border-color: #f5736f; color: #f5736f; }
      .connect-actions { margin-top: 10px; display: flex; gap: 8px; }
      .connect-actions button {
        flex: 1;
        border: 1px solid var(--line); border-radius: 7px;
        background: var(--card); color: var(--muted);
        font: inherit; padding: 7px; cursor: pointer;
        transition: background .12s, color .12s;
      }
      .connect-actions button:hover { background: #232323; color: var(--text); }
      .connect-actions .allow { background: var(--brand); border-color: var(--brand); color: #111; font-weight: 600; }
      .connect-actions .allow:hover { background: #e2ff62; border-color: #e2ff62; color: #111; }
      .connect-actions .allow:disabled { opacity: .5; cursor: default; }
      .connect-msg { margin-top: 9px; font-size: 12px; }
      .connect-msg.ok { color: var(--brand); }
      .connect-msg.err { color: #f5736f; }

      /* --- до входа: панель не притворяется пустой, а говорит почему --- */
      body.guest .timer,
      body.guest nav { display: none; }
      .guest-screen { display: none; }
      body.guest .guest-screen {
        flex: 1;
        display: flex; flex-direction: column;
        align-items: center; justify-content: center;
        gap: 6px; padding: 24px 20px; text-align: center;
      }
      body.guest main { display: none; }
      .guest-logo {
        width: 46px; height: 46px; margin-bottom: 6px;
        border-radius: 12px;
        background: var(--brand); color: #111;
        display: grid; place-items: center;
        font: 700 20px/1 system-ui, sans-serif;
      }
      .guest-title { font-size: 15px; font-weight: 600; }
      .guest-hint { color: var(--muted); }

      /* --- низ --- */
      footer {
        display: flex; gap: 8px;
        padding: 8px 12px;
        border-top: 1px solid var(--line);
      }
      footer button {
        flex: 1;
        border: 1px solid var(--line); border-radius: 7px;
        background: var(--card); color: var(--muted);
        font: inherit; padding: 7px;
        cursor: pointer;
        transition: background .12s, color .12s;
      }
      footer button:hover { background: #232323; color: var(--text); }
      /* Заливку задаём явно и в обычном, и в наведённом состоянии: brightness
         поверх незаданного фона гасил кнопку вместе с текстом. */
      footer .primary { background: var(--brand); border-color: var(--brand); color: #111; font-weight: 600; }
      footer .primary:hover { background: #e2ff62; border-color: #e2ff62; color: #111; }
    </style>
  </head>
  <body>
    <div class="timer">
      <button class="play" id="play"></button>
      <div class="timer-info">
        <div class="elapsed idle" id="elapsed">No timer running</div>
        <div class="timer-sub" id="timerSub">Click to start tracking</div>
      </div>
    </div>

    <nav>
      <button data-tab="inbox" class="active"><span data-t="tabInbox">For me</span><span class="count" id="cnt" hidden></span></button>
      <button data-tab="tasks" data-t="tabTasks">Tasks</button>
      <button data-tab="projects" data-t="tabProjects">Projects</button>
      <button data-tab="connect" data-t="tabConnect">Connect</button>
    </nav>

    <main id="list"></main>

    <div class="guest-screen">
      <div class="guest-logo">C</div>
      <div class="guest-title" id="guestTitle">Not signed in</div>
      <div class="guest-hint" id="guestHint">Sign in to see your timer, tasks and notifications</div>
    </div>

    <footer>
      <button id="openApp" class="primary" data-t="openApp">Open Chatick</button>
      <button id="close" data-t="close">Close</button>
    </footer>

    <script>
      let state = { authed: true, unread: 0, timer: null, notifications: [], tasks: [], projects: [], project: null, strings: {} }

      /**
       * Подписи приходят из веба вместе с состоянием: язык выбирают в
       * приложении, и панель обязана говорить на нём же. Запасные значения —
       * на первые миллисекунды, пока состояние не пришло.
       */
      const T = (key, fallback) => state.strings?.[key] || fallback
      let tab = 'inbox'
      const $ = (id) => document.getElementById(id)

      /**
       * Иконка статуса задачи. Рисуем svg вручную: тянуть библиотеку иконок
       * в панель ради четырёх фигур несоразмерно.
       */
      /** Плей и пауза — тоже svg: текстовые символы сидят на базовой линии
          и в квадратной кнопке смотрятся смещёнными. */
      const PLAY_ICON =
        '<svg class="status-icon" width="11" height="11" viewBox="0 0 24 24" fill="currentColor"><path d="M7 4.5v15l13-7.5z"/></svg>'
      const PAUSE_ICON =
        '<svg class="status-icon" width="11" height="11" viewBox="0 0 24 24" fill="currentColor"><path d="M7 4.5h3.5v15H7zM13.5 4.5H17v15h-3.5z"/></svg>'

      const STATUS_ICONS = {
        todo: '<circle cx="12" cy="12" r="9"/>',
        in_progress: '<circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="3.5" fill="currentColor" stroke="none"/>',
        review: '<path d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6-10-6-10-6Z"/><circle cx="12" cy="12" r="3"/>',
        done: '<circle cx="12" cy="12" r="9"/><path d="m8.5 12 2.5 2.5 4.5-5"/>',
      }
      const statusIcon = (status, size = 14) => {
        const key = STATUS_ICONS[status] ? status : 'todo'
        return `<svg class="status-icon st-${key}" width="${size}" height="${size}" viewBox="0 0 24 24"
                     fill="none" stroke="currentColor" stroke-width="2"
                     stroke-linecap="round" stroke-linejoin="round">${STATUS_ICONS[key]}</svg>`
      }

      /** Инициалы вместо картинки, когда аватарки нет. */
      const initials = (name) =>
        String(name || '?')
          .split(/\s+/)
          .slice(0, 2)
          .map((w) => w[0])
          .join('')
          .toUpperCase()

      const escape = (s) =>
        String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c])

      function elapsedText(timer) {
        // Битую дату отсекаем здесь же: иначе в счётчике появится NaN:NaN.
        const started = timer?.startedAt ? new Date(timer.startedAt).getTime() : NaN
        if (Number.isNaN(started)) return ''
        const sec = Math.max(0, Math.floor((Date.now() - started) / 1000))
        const h = Math.floor(sec / 3600)
        const m = Math.floor((sec % 3600) / 60)
        const s = sec % 60
        return h
          ? `${h}:${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`
          : `${m}:${String(s).padStart(2, '0')}`
      }

      function renderTimer() {
        const t = state.timer
        // svg, а не символ: текстовый глиф в круглой кнопке сидит не по центру
        $('play').innerHTML = (t ? PAUSE_ICON : PLAY_ICON).replace(/width="11" height="11"/, 'width="15" height="15"')
        $('play').classList.toggle('running', Boolean(t))
        // Без проекта стартовать нечему — кнопка гаснет, а не молча не срабатывает.
        const canStart = Boolean(t) || Boolean(state.project)
        $('play').disabled = !canStart
        $('play').title = t ? T('stop', 'Stop') : T('start', 'Start timer')
        if (t) {
          $('elapsed').textContent = elapsedText(t)
          $('elapsed').classList.remove('idle')
          // Проект показываем всегда, а не только вместо описания: куда
          // пишется время — половина ответа на вопрос «что сейчас идёт».
          const what = t.description || T('noTask', 'No task')
          $('timerSub').textContent = t.projectName ? `${t.projectName} · ${what}` : what
        } else {
          $('elapsed').textContent = T('idle', 'No timer running')
          $('elapsed').classList.add('idle')
          // Без открытого проекта запускать некуда — говорим об этом заранее,
          // а не после нажатия.
          $('timerSub').textContent = state.project
            ? T('idleHint', 'Click to start tracking')
            : T('idleNoProject', 'Open a project to start tracking')
        }
      }

      function renderList() {
        const el = $('list')
        const rows = []

        if (tab === 'inbox') {
          if (!state.notifications.length) {
            el.innerHTML = `<p class="empty">${T('emptyInbox', 'Anything that concerns you<br>will show up here')}</p>`
            return
          }
          for (const n of state.notifications.slice(0, 20)) {
            rows.push(`
              <button class="row" data-link="${escape(n.link)}" data-notification="${escape(n.id)}">
                ${n.unread ? '<span class="badge-dot"></span>' : '<span class="badge-dot" style="background:transparent"></span>'}
                <span class="body">
                  <span class="title">${escape(n.summary || n.title)}</span>
                  <span class="sub">${escape(n.projectName || n.title)}</span>
                </span>
              </button>`)
          }
        }

        if (tab === 'tasks') {
          if (!state.tasks.length) {
            el.innerHTML = `<p class="empty">${T('emptyTasks', 'No open tasks')}</p>`
            return
          }
          for (const t of state.tasks.slice(0, 30)) {
            const running = state.timer?.taskId === t.id
            rows.push(`
              <div class="row">
                ${statusIcon(t.status || 'todo', 15)}
                <button class="body" data-link="${escape(t.link)}"
                        style="border:0;background:none;color:inherit;font:inherit;text-align:start;cursor:pointer;padding:0">
                  <span class="title">${escape(t.number)} ${escape(t.title)}</span>
                  <span class="sub">${escape(t.projectName || '')}${t.due ? ` · ${T('due', 'due')} ${escape(t.due)}` : ''}</span>
                </button>
                <span class="task-actions">
                  <button class="mini ${running ? 'on' : ''}" data-timer="${escape(t.id)}"
                          title="${running ? T('stop', 'Stop') : T('start', 'Start timer')}">${running ? PAUSE_ICON : PLAY_ICON}</button>
                  <button class="mini" data-status="${escape(t.id)}" data-current="${escape(t.status || 'todo')}"
                          title="${T('taskSetStatus', 'Change status')}">${statusIcon(t.status || 'todo', 13)}</button>
                </span>
              </div>`)
          }
        }

        if (tab === 'projects') {
          if (!state.projects.length) {
            el.innerHTML = `<p class="empty">${T('emptyProjects', 'No projects yet')}</p>`
            return
          }
          for (const p of state.projects) {
            const here = state.project?.id === p.id
            // Строка выбирает проект активным (не открывая окно), кнопка
            // справа — открывает его в приложении. Это разные намерения.
            rows.push(`
              <div class="row ${here ? 'active' : ''}" data-pick="${escape(p.id)}">
                <span class="avatar" style="background:${escape(p.color || '#2a2a2a')};color:#fff">
                  ${p.logoUrl ? `<img src="${escape(p.logoUrl)}" alt="">` : escape(initials(p.name))}
                </span>
                <span class="body">
                  <span class="title">${escape(p.name)}</span>
                  <span class="sub">${p.unread ? `${p.unread} ${T('unreadOne', 'unread')}` : T('allRead', 'all read')}</span>
                </span>
                ${
                  here
                    ? `<span class="row-here">${T('projectHere', 'active')}</span>`
                    : ''
                }
                <button class="row-open" data-link="/p/${escape(p.id)}/chat">${T('projectOpen', 'Open')}</button>
              </div>`)
          }
        }

        if (tab === 'connect') {
          el.innerHTML = renderConnect()
          bindConnect()
          return
        }

        el.innerHTML = rows.join('')
      }

      /** Меню статусов рядом с кнопкой. Закрывается по выбору или клику мимо. */
      function openStatusMenu(btn) {
        document.querySelector('.status-menu')?.remove()

        const labels = {
          todo: T('statusTodo', 'To do'),
          in_progress: T('statusInProgress', 'In progress'),
          review: T('statusReview', 'Review'),
          done: T('statusDone', 'Done'),
        }
        const current = btn.dataset.current
        const menu = document.createElement('div')
        menu.className = 'status-menu'
        menu.innerHTML = Object.entries(labels)
          .map(
            ([key, label]) => `
              <button data-pick-status="${key}" class="${key === current ? 'on' : ''}">
                ${statusIcon(key, 15)}${escape(label)}
              </button>`,
          )
          .join('')

        // Ставим под кнопкой, не вылезая за правый край панели.
        const r = btn.getBoundingClientRect()
        menu.style.top = `${r.bottom + 4}px`
        menu.style.left = `${Math.max(6, Math.min(r.left, window.innerWidth - 156))}px`
        document.body.appendChild(menu)

        menu.onclick = (e) => {
          const pick = e.target.closest('[data-pick-status]')
          if (!pick) return
          window.panel.taskStatus(btn.dataset.status, pick.dataset.pickStatus)
          menu.remove()
        }
        // Клик мимо закрывает — но не тот же самый, что меню открыл.
        setTimeout(() => {
          const off = (e) => {
            if (!menu.contains(e.target)) {
              menu.remove()
              document.removeEventListener('click', off)
            }
          }
          document.addEventListener('click', off)
        }, 0)
      }

      // --- подключение ассистента ---------------------------------------------
      //
      // Коды приходят из редактора или терминала, и лезть за ними в браузер
      // неудобно — панель уже открыта. Проверку и подтверждение делает веб:
      // права и сессия есть только у него.

      let connect = { code: '', clientName: null, msg: null, msgKind: null, busy: false, target: null }

      function renderConnect() {
        const projects = state.projects || []
        const company = state.company

        // Компанию целиком показываем только тем, кто вправе её выдать:
        // сервер всё равно откажет, а предлагать неисполнимое — обманывать.
        // Все компании, которыми человек управляет, — не только первая:
        // подключить ассистента к компании, куда его позвали, было нельзя.
        const grantable = (state.companies || []).filter((c) => c.canGrantCompany)
        const companyNames = new Map((state.companies || []).map((c) => [c.id, c.name]))
        const targets = [
          ...grantable.map((c) => ({
            key: `c:${c.id}`,
            name: c.name,
            tag: T('connectWholeCompany', 'whole company'),
            color: null,
            company: null,
          })),
          // Подпись компанией: с несколькими компаниями одинаковые названия
          // проектов не редкость, и без неё непонятно, какой из них какой.
          ...projects.map((p) => ({
            key: `p:${p.id}`,
            name: p.name,
            tag: null,
            color: p.color,
            company: companyNames.size > 1 ? companyNames.get(p.companyId) || null : null,
          })),
        ]
        if (!connect.target && targets.length) connect.target = targets[0].key

        // Поиск: с десятком проектов в двух компаниях список превращается в
        // простыню, и кнопку «Разрешить» приходится искать прокруткой.
        const q = (connect.q || '').trim().toLowerCase()
        const shown = q
          ? targets.filter((x) => x.name.toLowerCase().includes(q) || (x.company || '').toLowerCase().includes(q))
          : targets

        const picker = shown
          .map(
            (x) => `
              <button class="pick ${x.key === connect.target ? 'on' : ''}" data-target="${escape(x.key)}">
                <span class="dot" style="background:${escape(x.color || '#3a3a3a')}"></span>
                <span class="pick-body">
                  <span class="pick-name">${escape(x.name)}</span>
                  ${x.company ? `<span class="pick-sub">${escape(x.company)}</span>` : ''}
                </span>
                ${x.tag ? `<span class="pick-tag">${escape(x.tag)}</span>` : ''}
              </button>`,
          )
          .join('')

        const conns = (state.connections || [])
          .map(
            (c) => `
              <div class="conn">
                <div class="conn-body">
                  <div class="conn-name">${escape(c.clientName)}</div>
                  <div class="conn-where">${escape(c.where)}${c.scope === 'company' ? ` · ${T('connectWholeCompany', 'whole company')}` : ''}</div>
                </div>
                <button class="conn-kill" data-revoke="${escape(c.id)}">${T('connectRevoke', 'Revoke')}</button>
              </div>`,
          )
          .join('')

        return `
          <div class="connect">
            <div class="invite">
              <p class="connect-hint">${T('connectInviteHint', 'Paste this into your assistant:')}</p>
              <div class="invite-row">
                <code id="inviteLine">${escape(state.strings?.inviteLine || '')}</code>
                <button id="copyInvite">${T('connectCopy', 'Copy')}</button>
              </div>
            </div>

            <p class="connect-hint">${T('connectHint', 'Enter the code shown by your assistant')}</p>
            <input id="codeInput" class="code-input" maxlength="12" spellcheck="false"
                   placeholder="XXXX-XXXX" value="${escape(connect.code)}" />
            ${
              connect.clientName
                ? `<div class="connect-box">
                     <div class="connect-who">${escape(connect.clientName)}</div>
                     <div class="connect-warn">${T('connectActsAsYou', 'Will act on your behalf in the chosen project')}</div>
                     <label class="connect-label">${T('connectWhere', 'Where to grant access')}</label>
                     ${
                       targets.length > 6
                         ? `<input id="targetSearch" class="target-search" spellcheck="false"
                                   placeholder="${T('connectSearch', 'Search…')}" value="${escape(connect.q || '')}" />`
                         : ''
                     }
                     <div class="picker">${
                       picker ||
                       `<p class="empty">${
                         q ? T('connectNothingFound', 'Nothing found') : T('emptyProjects', 'No projects yet')
                       }</p>`
                     }</div>
                     <div class="connect-actions">
                       <button class="allow" id="connectAllow" ${targets.length && !connect.busy ? '' : 'disabled'}>
                         ${T('connectAllow', 'Allow')}
                       </button>
                       <button id="connectCancel">${T('connectCancel', 'Cancel')}</button>
                     </div>
                   </div>`
                : ''
            }
            ${connect.msg ? `<p class="connect-msg ${connect.msgKind || ''}">${escape(connect.msg)}</p>` : ''}
            ${
              conns
                ? `<div class="conns">
                     <div class="conns-title">${T('connectActive', 'Active connections')}</div>
                     ${conns}
                   </div>`
                : ''
            }
          </div>`
      }

      /**
       * Перерисовка вкладки. Отдельно от renderList: пересобирать поле ввода
       * на каждый ответ значит терять курсор посреди набора.
       */
      function refreshConnect() {
        const el = $('list')
        const focused = document.activeElement?.id === 'codeInput'
        const caret = focused ? $('codeInput').selectionStart : null
        el.innerHTML = renderConnect()
        bindConnect()
        if (focused) {
          const input = $('codeInput')
          input.focus()
          if (caret !== null) input.setSelectionRange(caret, caret)
        }
      }

      function bindConnect() {
        const input = $('codeInput')
        if (!input) return

        // Курсор в поле сразу: вкладку открывают ровно затем, чтобы вставить код.
        if (!connect.clientName && document.activeElement !== input) input.focus()

        input.oninput = () => {
          connect.code = input.value.trim()
          connect.clientName = null
          connect.msg = null
          // Код формата XXXX-XXXX: как только набрана нужная длина, спрашиваем,
          // кто это, — вручную нажимать «проверить» незачем.
          if (connect.code.replace(/[^0-9a-z]/gi, '').length >= 8) {
            connect.busy = true
            window.panel.checkCode(connect.code)
          }
        }

        for (const btn of document.querySelectorAll('.pick')) {
          btn.onclick = () => {
            connect.target = btn.dataset.target
            refreshConnect()
          }
        }

        const copyBtn = $('copyInvite')
        if (copyBtn) {
          copyBtn.onclick = async () => {
            try {
              await navigator.clipboard.writeText(state.strings?.inviteLine || '')
              copyBtn.textContent = T('connectCopied', 'Copied')
              copyBtn.classList.add('done')
              // Возвращаем подпись: кнопка должна снова выглядеть нажимаемой.
              setTimeout(() => {
                copyBtn.textContent = T('connectCopy', 'Copy')
                copyBtn.classList.remove('done')
              }, 1600)
            } catch {
              /* буфер недоступен — строку видно, можно выделить руками */
            }
          }
        }

        const allow = $('connectAllow')
        if (allow) {
          allow.onclick = () => {
            if (!connect.target) return
            const [kind, id] = [connect.target.slice(0, 1), connect.target.slice(2)]
            connect.busy = true
            connect.msg = null
            refreshConnect()
            window.panel.approveCode(connect.code, kind === 'c' ? { companyId: id } : { projectId: id })
          }
        }

        const cancel = $('connectCancel')
        if (cancel) {
          cancel.onclick = () => {
            connect = { code: '', clientName: null, msg: null, msgKind: null, busy: false, target: null }
            refreshConnect()
          }
        }

        for (const btn of document.querySelectorAll('.conn-kill')) {
          btn.onclick = () => {
            btn.disabled = true
            window.panel.revokeConnection(btn.dataset.revoke)
          }
        }
      }

      window.panel.onConnect((r) => {
        connect.busy = false
        if (r.step === 'found') {
          connect.clientName = r.clientName
          connect.msg = null
        } else if (r.step === 'invalid') {
          // Пока код набирают по символу, «не найден» — обычное состояние,
          // а не ошибка: ругаемся только на полностью введённый код.
          connect.clientName = null
          connect.msg = connect.code.length >= 9 ? T('connectBadCode', 'Code not found or expired') : null
          connect.msgKind = 'err'
        } else if (r.step === 'approved') {
          connect = {
            code: '', clientName: null, target: null, busy: false,
            msg: T('connectDone', 'Access granted'), msgKind: 'ok',
          }
        } else if (r.step === 'revoked') {
          connect.msg = T('connectRevoked', 'Connection closed')
          connect.msgKind = 'ok'
        } else if (r.step === 'failed') {
          connect.msg = r.error || T('connectFailed', 'Could not grant access')
          connect.msgKind = 'err'
        }
        if (tab === 'connect') refreshConnect()
      })

      function render() {
        // статичные подписи: вкладки и кнопки внизу
        document.querySelectorAll('[data-t]').forEach((el) => {
          const val = state.strings?.[el.dataset.t]
          if (val) el.textContent = val
        })
        document.documentElement.dir = state.strings?.dir === 'rtl' ? 'rtl' : 'ltr'

        // Пока не вошли, показывать нечего — и кнопка внизу зовёт войти,
        // а не «открыть», потому что открывать пока некуда.
        document.body.classList.toggle('guest', state.authed === false)
        if (state.authed === false) {
          $('guestTitle').textContent = T('signedOut', 'Not signed in')
          $('guestHint').innerHTML = T('signedOutHint', 'Sign in to see your timer,<br>tasks and notifications')
          $('openApp').textContent = T('signIn', 'Sign in')
          $('cnt').hidden = true
          return
        }

        renderTimer()
        const cnt = $('cnt')
        cnt.hidden = !state.unread
        cnt.textContent = state.unread > 99 ? '99+' : state.unread
        renderList()
      }

      // --- события ---
      $('play').onclick = () => window.panel.toggleTimer()
      $('openApp').onclick = () => window.panel.openApp()
      $('close').onclick = () => window.panel.close()

      document.querySelectorAll('nav button').forEach((btn) => {
        btn.onclick = () => {
          tab = btn.dataset.tab
          document.querySelectorAll('nav button').forEach((b) => b.classList.toggle('active', b === btn))
          // Список подключений живёт минутным опросом — при открытии вкладки
          // обновляем сразу, иначе только что выданный доступ не видно.
          if (tab === 'connect') window.panel.refreshConnections()
          renderList()
        }
      })

      $('list').onclick = (e) => {
        // Кнопка «Открыть» — в приложение; сама строка — сделать активным.
        const open = e.target.closest('[data-link]')
        if (open) {
          // id уведомления передаём явно: по ссылке их не различить —
          // несколько уведомлений одного проекта ведут в одно место.
          window.panel.open(open.dataset.link, open.dataset.notification || null)
          return
        }
        // Таймер на задаче: перебивает текущий — работают над чем-то одним.
        const timer = e.target.closest('[data-timer]')
        if (timer) {
          window.panel.taskTimer(timer.dataset.timer)
          return
        }

        // Статус выбирают из списка: «следующий по кругу» заставлял бы
        // угадывать, куда попадёшь, и жать несколько раз.
        const status = e.target.closest('[data-status]')
        if (status) {
          openStatusMenu(status)
          return
        }

        const pick = e.target.closest('[data-pick]')
        if (pick) {
          window.panel.setProject(pick.dataset.pick)
          return
        }
        const row = e.target.closest('.row')
        if (row?.dataset.link) window.panel.open(row.dataset.link)
      }

      // Поиск по целям подключения: перерисовываем список, не теряя фокус
      document.addEventListener('input', (e) => {
        if (e.target && e.target.id === 'targetSearch') {
          connect.q = e.target.value
          render()
          const el = document.getElementById('targetSearch')
          if (el) {
            el.focus()
            el.setSelectionRange(el.value.length, el.value.length)
          }
        }
      })

      window.panel.onState((next) => {
        state = { ...state, ...next }
        render()
      })

      // Секунды должны идти: панель открыта, пока на неё смотрят.
      setInterval(() => state.timer && renderTimer(), 1000)
      render()
    </script>
  </body>
</html>
