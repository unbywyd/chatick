<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Chatick</title>
    <style>
      /* Страница показывается ровно тогда, когда веб недоступен, — значит
         переводы взять неоткуда. Держим их прямо здесь и выбираем по языку
         системы. */
      :root { color-scheme: dark; }
      body {
        margin: 0;
        height: 100vh;
        display: grid;
        place-items: center;
        background: #0a0a0a;
        color: #e8e8e8;
        font: 15px/1.5 system-ui, -apple-system, 'Segoe UI', sans-serif;
      }
      .box { max-width: 380px; text-align: center; padding: 24px; }
      h1 { margin: 0 0 8px; font-size: 18px; }
      p { margin: 0 0 20px; color: #9a9a9a; }
      button {
        border: 0;
        border-radius: 8px;
        padding: 10px 20px;
        font: inherit;
        font-weight: 600;
        color: #1a1a1a;
        background: #d4f34a;
        cursor: pointer;
      }
      button:hover { background: #e2ff62; }
      .hint { margin-top: 16px; font-size: 12px; color: #6a6a6a; }
    </style>
  </head>
  <body>
    <div class="box">
      <h1 id="title">No connection</h1>
      <p id="text">Chatick could not reach the server. Check your network and try again.</p>
      <button id="retry">Try again</button>
      <p class="hint" id="hint">The timer and notifications resume once the connection is back.</p>
    </div>

    <script>
      const STRINGS = {
        en: {
          title: 'No connection',
          text: 'Chatick could not reach the server. Check your network and try again.',
          retry: 'Try again',
          hint: 'The timer and notifications resume once the connection is back.',
        },
        ru: {
          title: 'Нет соединения',
          text: 'Chatick не смог связаться с сервером. Проверьте сеть и попробуйте снова.',
          retry: 'Попробовать снова',
          hint: 'Таймер и уведомления продолжат работать, когда связь вернётся.',
        },
        he: {
          title: 'אין חיבור',
          text: 'ל-Chatick לא הצליח להתחבר לשרת. בדקו את הרשת ונסו שוב.',
          retry: 'לנסות שוב',
          hint: 'הטיימר וההתראות יחזרו לפעול כשהחיבור יחזור.',
        },
      }

      const lang = (navigator.language || 'en').slice(0, 2)
      const t = STRINGS[lang] || STRINGS.en
      document.documentElement.lang = STRINGS[lang] ? lang : 'en'
      document.documentElement.dir = lang === 'he' ? 'rtl' : 'ltr'

      document.getElementById('title').textContent = t.title
      document.getElementById('text').textContent = t.text
      document.getElementById('retry').textContent = t.retry
      document.getElementById('hint').textContent = t.hint
      document.getElementById('retry').onclick = () => location.replace('https://app.chatick.com')
    </script>
  </body>
</html>
