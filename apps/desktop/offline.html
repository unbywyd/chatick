<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <title>Chatick — нет соединения</title>
    <style>
      /* Страница живёт внутри приложения и стилями веба не пользуется:
         она показывается ровно тогда, когда веб загрузить не удалось. */
      :root { color-scheme: dark; }
      body {
        margin: 0;
        height: 100vh;
        display: grid;
        place-items: center;
        background: #0a0a0a;
        color: #e8e8e8;
        font: 15px/1.5 system-ui, -apple-system, 'Segoe UI', sans-serif;
      }
      .box { max-width: 380px; text-align: center; padding: 24px; }
      h1 { margin: 0 0 8px; font-size: 18px; }
      p { margin: 0 0 20px; color: #9a9a9a; }
      button {
        border: 0;
        border-radius: 8px;
        padding: 10px 20px;
        font: inherit;
        font-weight: 600;
        color: #1a1a1a;
        background: #d4f34a;
        cursor: pointer;
      }
      button:hover { filter: brightness(1.05); }
      .hint { margin-top: 16px; font-size: 12px; color: #6a6a6a; }
    </style>
  </head>
  <body>
    <div class="box">
      <h1>Нет соединения</h1>
      <p>Chatick не смог связаться с сервером. Проверьте сеть и попробуйте снова.</p>
      <button onclick="location.replace('https://app.chatick.com')">Попробовать снова</button>
      <p class="hint">Таймер и уведомления продолжат работать, когда связь вернётся.</p>
    </div>
  </body>
</html>
